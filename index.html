<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умное меню · Календарь</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        :root {
            --bg-primary: #f5f3f0;
            --bg-app: rgba(255, 255, 255, 0.8);
            --bg-app-border: rgba(255, 255, 255, 0.4);
            --text-primary: #1c1c2a;
            --text-secondary: #4a4a5a;
            --text-muted: #6b6b7a;
            --cell-bg: rgba(255, 255, 255, 0.5);
            --cell-border: rgba(255, 255, 255, 0.7);
            --tag-bg: white;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --btn-bg: #1e1e2a;
            --btn-text: white;
            --input-bg: rgba(255, 255, 255, 0.7);
            --badge-bg: rgba(0, 0, 0, 0.05);
            --empty-border: rgba(0, 0, 0, 0.05);
            --planned-color: #fbbf24;
            --done-color: #34d399;
            --planned-bg: rgba(251, 191, 36, 0.15);
            --done-bg: rgba(52, 211, 153, 0.15);
            --modal-overlay: rgba(0, 0, 0, 0.4);
            --modal-bg: white;
            --day-hover: rgba(0, 0, 0, 0.04);
            --menu-item-bg: rgba(255, 255, 255, 0.3);
            --modal-text: #1c1c2a;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0f0f17;
                --bg-app: rgba(25, 25, 38, 0.92);
                --bg-app-border: rgba(255, 255, 255, 0.06);
                --text-primary: #ececf0;
                --text-secondary: #b0b0c8;
                --text-muted: #7a7a92;
                --cell-bg: rgba(40, 40, 56, 0.5);
                --cell-border: rgba(255, 255, 255, 0.05);
                --tag-bg: rgba(45, 45, 65, 0.7);
                --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
                --btn-bg: #3a3a52;
                --btn-text: #f0f0f5;
                --input-bg: rgba(45, 45, 65, 0.6);
                --badge-bg: rgba(255, 255, 255, 0.05);
                --empty-border: rgba(255, 255, 255, 0.03);
                --planned-color: #fcd34d;
                --done-color: #6ee7b7;
                --planned-bg: rgba(252, 211, 77, 0.12);
                --done-bg: rgba(110, 231, 183, 0.12);
                --modal-overlay: rgba(0, 0, 0, 0.7);
                --modal-bg: #1e1e2e;
                --day-hover: rgba(255, 255, 255, 0.05);
                --menu-item-bg: rgba(40, 40, 56, 0.5);
                --modal-text: #ececf0;
            }
        }

        body {
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            transition: background 0.3s;
        }

        .app {
            max-width: 900px;
            width: 100%;
            background: var(--bg-app);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 28px 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--bg-app-border);
            transition: all 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 24px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 620;
            letter-spacing: -0.3px;
            background: linear-gradient(145deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo span {
            font-size: 13px;
            color: var(--text-muted);
            background: var(--badge-bg);
            padding: 3px 12px;
            border-radius: 40px;
            margin-left: 8px;
            -webkit-text-fill-color: var(--text-muted);
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .view-toggle {
            display: flex;
            gap: 4px;
            background: rgba(128, 128, 140, 0.1);
            padding: 4px;
            border-radius: 40px;
        }

        .view-toggle button {
            border: none;
            background: transparent;
            padding: 6px 18px;
            border-radius: 30px;
            font-weight: 550;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
        }

        .view-toggle button.active {
            background: var(--tag-bg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            color: var(--text-primary);
        }

        .filter-toggle {
            display: flex;
            gap: 4px;
            background: rgba(128, 128, 140, 0.1);
            padding: 4px;
            border-radius: 40px;
        }

        .filter-toggle button {
            border: none;
            background: transparent;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
        }

        .filter-toggle button.active {
            background: var(--tag-bg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            color: var(--text-primary);
        }

        .smart-btn-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .what-cook-btn {
            background: var(--btn-bg);
            border: none;
            padding: 12px 32px;
            border-radius: 60px;
            color: var(--btn-text);
            font-size: 16px;
            font-weight: 580;
            box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .what-cook-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.12);
        }

        .what-cook-btn:active {
            transform: scale(0.97);
        }

        .suggestion-badge {
            background: rgba(251, 191, 36, 0.2);
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 450;
            color: #fbbf24;
        }

        /* ——— КАЛЕНДАРЬ ——— */
        .calendar-wrap {
            background: rgba(128, 128, 140, 0.04);
            border-radius: 28px;
            padding: 12px 8px 16px;
            margin-bottom: 16px;
            touch-action: pan-y;
            user-select: none;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px 12px;
        }

        .calendar-header h2 {
            font-size: 18px;
            font-weight: 560;
            color: var(--text-primary);
        }

        .month-nav {
            display: flex;
            gap: 8px;
        }

        .month-nav button {
            background: var(--cell-bg);
            border: 1px solid var(--cell-border);
            border-radius: 30px;
            padding: 6px 16px;
            cursor: pointer;
            font-size: 16px;
            color: var(--text-primary);
            transition: 0.15s;
        }

        .month-nav button:hover {
            background: var(--day-hover);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 500;
            color: var(--text-muted);
            font-size: 12px;
            letter-spacing: 0.5px;
            padding: 8px 0 4px;
            text-transform: uppercase;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day-cell {
            aspect-ratio: 1;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--cell-bg);
            border: 1px solid var(--cell-border);
            cursor: pointer;
            transition: 0.15s;
            position: relative;
            min-height: 44px;
            padding: 2px;
        }

        .day-cell:hover {
            transform: scale(1.05);
            background: var(--day-hover);
            z-index: 2;
        }

        .day-cell.empty {
            background: transparent;
            border: 1px dashed var(--empty-border);
            cursor: default;
            pointer-events: none;
        }

        .day-cell.empty:hover {
            transform: none;
            background: transparent;
        }

        .day-number {
            font-weight: 550;
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1;
        }

        .day-cell.has-done {
            background: var(--done-bg);
            border-color: var(--done-color);
        }

        .day-cell.has-done .day-number {
            color: var(--done-color);
        }

        .day-cell.has-planned {
            background: var(--planned-bg);
            border-color: var(--planned-color);
        }

        .day-cell.has-planned .day-number {
            color: var(--planned-color);
        }

        .day-cell.has-both {
            background: linear-gradient(135deg, var(--done-bg) 50%, var(--planned-bg) 50%);
            border-color: var(--done-color);
        }

        .day-cell .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-top: 2px;
        }

        .day-cell .dot.done-dot {
            background: var(--done-color);
        }

        .day-cell .dot.planned-dot {
            background: var(--planned-color);
        }

        .day-cell .dot.both-dot {
            background: var(--done-color);
            box-shadow: 4px 0 0 var(--planned-color);
        }

        .day-cell.today {
            border-color: var(--text-primary);
            border-width: 2px;
        }

        /* ——— МОДАЛКА ——— */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-overlay);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--modal-bg);
            border-radius: 32px;
            padding: 32px 28px;
            max-width: 420px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--cell-border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--modal-text);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0 8px;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-dish {
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--cell-bg);
            border-left: 4px solid var(--text-muted);
            color: var(--modal-text);
        }

        .modal-dish.done {
            border-left-color: var(--done-color);
        }

        .modal-dish.planned {
            border-left-color: var(--planned-color);
        }

        .modal-dish .dish-status {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
        }

        .modal-empty {
            color: var(--text-muted);
            text-align: center;
            padding: 30px 0;
            font-size: 15px;
        }

        /* ——— МЕНЮ (список под календарём) ——— */
        .menu-list {
            margin-top: 20px;
            background: rgba(128, 128, 140, 0.04);
            border-radius: 24px;
            padding: 16px 18px;
            max-height: 300px;
            overflow-y: auto;
        }

        .menu-list h3 {
            font-weight: 540;
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .menu-group {
            margin-bottom: 12px;
        }

        .menu-date {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 4px;
        }

        .menu-item {
            padding: 6px 12px;
            border-radius: 12px;
            background: var(--menu-item-bg);
            margin-bottom: 4px;
            font-size: 14px;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            border-left: 3px solid var(--text-muted);
        }

        .menu-item.done {
            border-left-color: var(--done-color);
        }
        .menu-item.planned {
            border-left-color: var(--planned-color);
        }

        .menu-item .status-badge {
            font-size: 12px;
            color: var(--text-muted);
        }

        .menu-empty {
            color: var(--text-muted);
            text-align: center;
            padding: 20px 0;
            font-size: 14px;
        }

        /* ——— БИБЛИОТЕКА ——— */
        .dish-library {
            margin-top: 20px;
            background: rgba(128, 128, 140, 0.04);
            border-radius: 24px;
            padding: 16px 18px 14px;
        }

        .dish-library h3 {
            font-weight: 540;
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .dish-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }

        .dish-tag {
            background: var(--tag-bg);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            border: 1px solid rgba(128, 128, 140, 0.06);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-primary);
        }

        .dish-tag .remove-dish {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            padding: 0 2px;
        }

        .dish-tag .remove-dish:hover {
            color: #e55a5a;
        }

        .add-dish-form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .add-dish-form input {
            flex: 2;
            min-width: 140px;
            padding: 10px 16px;
            border-radius: 40px;
            border: 1px solid rgba(128, 128, 140, 0.12);
            background: var(--input-bg);
            font-size: 13px;
            outline: none;
            color: var(--text-primary);
        }

        .add-dish-form input::placeholder {
            color: var(--text-muted);
        }

        .add-dish-form input:focus {
            border-color: var(--done-color);
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.15);
        }

        .add-dish-form input[type="date"] {
            flex: 1;
            min-width: 120px;
        }

        .add-dish-form select {
            padding: 10px 14px;
            border-radius: 40px;
            border: 1px solid rgba(128, 128, 140, 0.12);
            background: var(--input-bg);
            font-size: 13px;
            outline: none;
            color: var(--text-primary);
        }

        .add-dish-form button {
            background: var(--btn-bg);
            border: none;
            padding: 10px 22px;
            border-radius: 40px;
            color: var(--btn-text);
            font-weight: 550;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
        }

        .add-dish-form button:hover {
            filter: brightness(1.12);
        }

        .hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            .app { padding: 16px 12px; border-radius: 28px; }
            .day-cell { min-height: 38px; }
            .day-number { font-size: 12px; }
            .header { flex-direction: column; align-items: stretch; }
            .controls { justify-content: center; flex-wrap: wrap; }
            .modal { padding: 24px 18px; margin: 10px; }
            .what-cook-btn { font-size: 14px; padding: 10px 20px; }
            .logo h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

<div class="app">
    <!-- ШАПКА -->
    <div class="header">
        <div class="logo">
            <h1>🍽️ Меню <span>умное</span></h1>
        </div>
        <div class="controls">
            <div class="filter-toggle" id="filterToggle">
                <button class="active" data-filter="all">Все</button>
                <button data-filter="done">✅ Готовила</button>
                <button data-filter="planned">📅 Планирую</button>
            </div>
            <div class="view-toggle" id="viewToggle">
                <button class="active" data-view="month">Месяц</button>
                <button data-view="week">Неделя</button>
            </div>
        </div>
    </div>

    <!-- КНОПКА -->
    <div class="smart-btn-wrap">
        <button class="what-cook-btn" id="suggestBtn">
            🤔 Что приготовить?
            <span class="suggestion-badge" id="suggestionBadge">⚡</span>
        </button>
    </div>

    <!-- КАЛЕНДАРЬ -->
    <div class="calendar-wrap" id="calendarWrap">
        <div class="calendar-header">
            <button class="month-nav" id="prevMonth">‹</button>
            <h2 id="monthTitle">Август 2026</h2>
            <button class="month-nav" id="nextMonth">›</button>
        </div>
        <div class="weekdays">
            <div>Пн</div><div>Вт</div><div>Ср</div><div>Чт</div><div>Пт</div><div>Сб</div><div>Вс</div>
        </div>
        <div class="days-grid" id="calendarGrid"></div>
    </div>

    <!-- МЕНЮ (список) -->
    <div class="menu-list" id="menuList">
        <h3>📋 Меню на <span id="menuPeriod">месяц</span></h3>
        <div id="menuContent"></div>
    </div>

    <!-- БИБЛИОТЕКА -->
    <div class="dish-library">
        <h3>📚 Все блюда</h3>
        <div class="dish-tags" id="dishTagsContainer"></div>
        <div class="add-dish-form">
            <input type="text" id="newDishInput" placeholder="Название блюда">
            <input type="date" id="newDishDate">
            <select id="newDishStatus">
                <option value="done">✅ Готовила</option>
                <option value="planned">📅 Планирую</option>
            </select>
            <button id="addDishBtn">➕</button>
        </div>
        <div class="hint">Кликни по дню в календаре — увидишь все блюда на эту дату</div>
    </div>
</div>

<!-- МОДАЛКА -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalDate">26 августа 2026</h3>
            <button class="modal-close" id="modalClose">✕</button>
        </div>
        <div id="modalContent"></div>
    </div>
</div>

<script>
    // ——— ДАННЫЕ ———
    const MY_DISHES = [
        // ФАКТ
        { name: 'Гороховый суп', status: 'done', date: '2026-08-24' },
        { name: 'Запеканка из фарша и овощей', status: 'done', date: '2026-08-25' },
        { name: 'Колбаски и запеченая картошка', status: 'done', date: '2026-08-26' },

        // ПЛАН
        { name: 'Плов', status: 'planned', date: '2026-08-28' },
        { name: 'Салат с крабовыми палочками', status: 'planned', date: '2026-08-28' },
        { name: 'Суп борщ?', status: 'planned', date: '2026-08-31' },
        { name: 'Котлеты с картофельным пюре', status: 'planned', date: '2026-09-01' },
        { name: 'Салат морковь по-корейски', status: 'planned', date: '2026-09-01' },
        { name: 'Печень и перловка', status: 'planned', date: '2026-09-02' },
        { name: 'Мясо по-французски', status: 'planned', date: '2026-09-03' },
        { name: 'Морская капуста с крабовыми палочками', status: 'planned', date: '2026-09-04' },
        { name: 'Суп с сайрой', status: 'planned', date: '2026-09-07' },
        { name: 'Тушеная капуста', status: 'planned', date: '2026-09-08' },
        { name: 'Запеченные куриные ножки', status: 'planned', date: '2026-09-09' },
        { name: 'Фунчоза', status: 'planned', date: '2026-09-09' },
        { name: 'Удон', status: 'planned', date: '2026-09-10' },
        { name: 'Паста Болоньезе', status: 'planned', date: '2026-09-12' },
    ];

    let dishes = [];
    let currentDate = new Date();
    let currentFilter = 'all';
    let currentView = 'month'; // 'month' или 'week'

    function initDishes() {
        const saved = localStorage.getItem('smartMenuDishes_v2');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (parsed.length > 0) {
                    dishes = parsed;
                    return;
                }
            } catch(e) {}
        }

        const result = MY_DISHES.map((d, i) => ({ ...d, id: Date.now() + i }));

        // Блюда без даты
        const noDate = [
            'Салат с морской капустой и крабовым мясом',
            'Гречка и салат из свежей капусты как в столовой',
            'Суп-пюре из кабачков'
        ];
        const today = new Date();
        noDate.forEach((name, idx) => {
            const d = new Date(today);
            d.setDate(d.getDate() + 7 + idx);
            result.push({
                id: Date.now() + 1000 + idx,
                name: name,
                status: 'planned',
                date: d.toISOString().slice(0, 10)
            });
        });

        dishes = result;
        saveDishes();
    }

    function saveDishes() {
        localStorage.setItem('smartMenuDishes_v2', JSON.stringify(dishes));
    }

    // ——— ВСПОМОГАТЕЛЬНЫЕ ———
    function getDishesForDate(dateStr) {
        return dishes.filter(d => d.date === dateStr);
    }

    function formatDate(date) {
        const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
        return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
    }

    function getWeekDays(baseDate) {
        const start = new Date(baseDate);
        start.setDate(start.getDate() - start.getDay() + 1); // понедельник
        const week = [];
        for (let i = 0; i < 7; i++) {
            const d = new Date(start);
            d.setDate(start.getDate() + i);
            week.push(d);
        }
        return week;
    }

    // ——— РЕНДЕР КАЛЕНДАРЯ ———
    function renderCalendar() {
        const grid = document.getElementById('calendarGrid');
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        document.getElementById('monthTitle').textContent =
            `${['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][month]} ${year}`;

        grid.innerHTML = '';

        if (currentView === 'month') {
            // Месяц
            const first = new Date(year, month, 1);
            const last = new Date(year, month + 1, 0);
            const totalDays = last.getDate();
            let startDay = first.getDay() - 1;
            if (startDay < 0) startDay = 6;

            for (let i = 0; i < startDay; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell empty';
                grid.appendChild(empty);
            }

            const today = new Date();
            const todayStr = today.toISOString().slice(0, 10);

            for (let day = 1; day <= totalDays; day++) {
                const d = new Date(year, month, day);
                const dateStr = d.toISOString().slice(0, 10);
                const cell = createDayCell(d, dateStr, todayStr);
                grid.appendChild(cell);
            }
        } else {
            // Неделя
            const week = getWeekDays(currentDate);
            const today = new Date();
            const todayStr = today.toISOString().slice(0, 10);
            week.forEach(d => {
                const dateStr = d.toISOString().slice(0, 10);
                const cell = createDayCell(d, dateStr, todayStr);
                grid.appendChild(cell);
            });
        }

        updateMenu();
    }

    function createDayCell(date, dateStr, todayStr) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        const dayDishes = getDishesForDate(dateStr);
        const hasDone = dayDishes.some(d => d.status === 'done');
        const hasPlanned = dayDishes.some(d => d.status === 'planned');

        let show = true;
        if (currentFilter === 'done' && !hasDone) show = false;
        if (currentFilter === 'planned' && !hasPlanned) show = false;

        if (!show && dayDishes.length === 0) {
            cell.classList.add('empty');
            cell.style.cursor = 'default';
            cell.style.pointerEvents = 'none';
        }

        if (hasDone) cell.classList.add('has-done');
        if (hasPlanned) cell.classList.add('has-planned');
        if (hasDone && hasPlanned) cell.classList.add('has-both');

        if (dateStr === todayStr) cell.classList.add('today');

        let dot = '';
        if (hasDone && hasPlanned) dot = '<span class="dot both-dot"></span>';
        else if (hasDone) dot = '<span class="dot done-dot"></span>';
        else if (hasPlanned) dot = '<span class="dot planned-dot"></span>';

        cell.innerHTML = `<span class="day-number">${date.getDate()}</span>${dot}`;

        cell.addEventListener('click', () => {
            if (dayDishes.length > 0 || show) {
                openModal(dateStr);
            }
        });

        return cell;
    }

    // ——— МЕНЮ (список) ———
    function updateMenu() {
        const container = document.getElementById('menuContent');
        const periodLabel = document.getElementById('menuPeriod');
        periodLabel.textContent = currentView === 'month' ? 'месяц' : 'неделя';

        let days = [];
        if (currentView === 'month') {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const first = new Date(year, month, 1);
            const last = new Date(year, month + 1, 0);
            for (let d = 1; d <= last.getDate(); d++) {
                days.push(new Date(year, month, d));
            }
        } else {
            days = getWeekDays(currentDate);
        }

        // Собираем все блюда за период, группируем по дате
        const grouped = {};
        days.forEach(day => {
            const dateStr = day.toISOString().slice(0, 10);
            const dayDishes = getDishesForDate(dateStr);
            if (dayDishes.length > 0) {
                grouped[dateStr] = dayDishes;
            }
        });

        const sortedDates = Object.keys(grouped).sort();

        if (sortedDates.length === 0) {
            container.innerHTML = `<div class="menu-empty">😌 Нет блюд на этот период</div>`;
            return;
        }

        let html = '';
        sortedDates.forEach(dateStr => {
            const d = new Date(dateStr);
            const dayDishes = grouped[dateStr];
            const displayDate = formatDate(d);
            html += `<div class="menu-group">`;
            html += `<div class="menu-date">${displayDate}</div>`;
            dayDishes.forEach(dish => {
                const statusLabel = dish.status === 'done' ? '✅' : '📅';
                html += `
                    <div class="menu-item ${dish.status}">
                        <span>${dish.name}</span>
                        <span class="status-badge">${statusLabel}</span>
                    </div>
                `;
            });
            html += `</div>`;
        });

        container.innerHTML = html;
    }

    // ——— МОДАЛКА ———
    function openModal(dateStr) {
        const overlay = document.getElementById('modalOverlay');
        const modalDate = document.getElementById('modalDate');
        const content = document.getElementById('modalContent');

        const d = new Date(dateStr);
        modalDate.textContent = formatDate(d);

        const dayDishes = getDishesForDate(dateStr);

        if (dayDishes.length === 0) {
            content.innerHTML = `<div class="modal-empty">😌 На этот день ничего не запланировано</div>`;
        } else {
            content.innerHTML = dayDishes.map(d => `
                <div class="modal-dish ${d.status}">
                    <span>${d.name}</span>
                    <span class="dish-status">${d.status === 'done' ? '✅ Готовила' : '📅 Планирую'}</span>
                </div>
            `).join('');
        }

        overlay.classList.add('active');
    }

    document.getElementById('modalClose').addEventListener('click', () => {
        document.getElementById('modalOverlay').classList.remove('active');
    });

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
            document.getElementById('modalOverlay').classList.remove('active');
        }
    });

    // ——— НАВИГАЦИЯ ———
    function changeMonth(delta) {
        currentDate.setMonth(currentDate.getMonth() + delta);
        renderCalendar();
    }

    document.getElementById('prevMonth').addEventListener('click', () => changeMonth(-1));
    document.getElementById('nextMonth').addEventListener('click', () => changeMonth(1));

    // ——— СВАЙП ———
    let touchStartX = 0;
    let touchEndX = 0;
    const wrap = document.getElementById('calendarWrap');

    wrap.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    });

    wrap.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) {
            if (diff > 0) changeMonth(1);
            else changeMonth(-1);
        }
    });

    // Также добавим поддержку мыши для десктопа (drag)
    let mouseDown = false;
    let mouseStartX = 0;
    wrap.addEventListener('mousedown', (e) => {
        mouseDown = true;
        mouseStartX = e.screenX;
    });
    window.addEventListener('mouseup', (e) => {
        if (mouseDown) {
            const diff = mouseStartX - e.screenX;
            if (Math.abs(diff) > 50) {
                if (diff > 0) changeMonth(1);
                else changeMonth(-1);
            }
            mouseDown = false;
        }
    });

    // ——— ПЕРЕКЛЮЧЕНИЕ ВИДОВ ———
    document.querySelectorAll('#viewToggle button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#viewToggle button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentView = this.dataset.view;
            renderCalendar();
        });
    });

    // ——— ФИЛЬТР ———
    document.querySelectorAll('#filterToggle button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#filterToggle button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentFilter = this.dataset.filter;
            renderCalendar();
        });
    });

    // ——— БИБЛИОТЕКА ТЕГОВ ———
    function renderTags() {
        const container = document.getElementById('dishTagsContainer');
        container.innerHTML = '';
        const sorted = [...dishes].sort((a, b) => a.name.localeCompare(b.name));
        sorted.forEach(d => {
            const tag = document.createElement('span');
            tag.className = 'dish-tag';
            const icon = d.status === 'done' ? '✅' : '📅';
            tag.innerHTML = `${icon} ${d.name} <button class="remove-dish" data-id="${d.id}">✕</button>`;
            container.appendChild(tag);
        });

        document.querySelectorAll('.remove-dish').forEach(btn => {
            btn.addEventListener('click', function() {
                const id = Number(this.dataset.id);
                dishes = dishes.filter(d => d.id !== id);
                saveDishes();
                renderTags();
                renderCalendar();
                updateSuggestion();
            });
        });
    }

    // ——— ГЛАВНАЯ ФИЧА ———
    function suggestDish() {
        const doneDishes = dishes.filter(d => d.status === 'done');
        if (doneDishes.length === 0) {
            const planned = dishes.filter(d => d.status === 'planned');
            if (planned.length > 0) {
                const random = planned[Math.floor(Math.random() * planned.length)];
                return { dish: random, reason: 'Нет истории, но есть план! 😉' };
            }
            return { dish: null, reason: 'Добавь блюда!' };
        }

        const lastCooked = {};
        doneDishes.forEach(d => {
            if (!lastCooked[d.name] || d.date > lastCooked[d.name]) {
                lastCooked[d.name] = d.date;
            }
        });

        let oldestName = null;
        let oldestDate = null;
        for (const [name, date] of Object.entries(lastCooked)) {
            if (!oldestDate || date < oldestDate) {
                oldestDate = date;
                oldestName = name;
            }
        }

        const candidate = doneDishes.find(d => d.name === oldestName && d.date === oldestDate);
        if (candidate) {
            const today = new Date();
            const lastDate = new Date(candidate.date);
            const diffDays = Math.floor((today - lastDate) / (1000 * 60 * 60 * 24));
            let reason = `Не готовила "${candidate.name}" ${diffDays} дн.`;
            if (diffDays > 30) reason = `🔥 Давно не было "${candidate.name}" (${diffDays} дн.)!`;
            else if (diffDays > 14) reason = `⏳ "${candidate.name}" ждал ${diffDays} дн.`;
            else reason = `🥘 "${candidate.name}" — отличный вариант (${diffDays} дн.)`;
            return { dish: candidate, reason };
        }

        const fallback = dishes[Math.floor(Math.random() * dishes.length)];
        if (fallback) return { dish: fallback, reason: 'Попробуй что-то новенькое!' };
        return { dish: null, reason: 'Добавь блюда!' };
    }

    function updateSuggestion() {
        const result = suggestDish();
        const badge = document.getElementById('suggestionBadge');
        badge.textContent = result.dish ? `✨ ${result.dish.name}` : '⚡ нет блюд';
    }

    document.getElementById('suggestBtn').addEventListener('click', function() {
        const result = suggestDish();
        if (result.dish) {
            alert(`🍽️ Предлагаю: ${result.dish.name}\n\n${result.reason}`);
        } else {
            alert(`❌ ${result.reason}`);
        }
        updateSuggestion();
    });

    // ——— ДОБАВЛЕНИЕ БЛЮДА ———
    document.getElementById('addDishBtn').addEventListener('click', function() {
        const input = document.getElementById('newDishInput');
        const dateInput = document.getElementById('newDishDate');
        const statusSelect = document.getElementById('newDishStatus');
        const name = input.value.trim();
        if (!name) {
            alert('Введи название блюда');
            return;
        }

        let date = dateInput.value;
        if (!date) {
            const d = new Date();
            d.setDate(d.getDate() + 1);
            date = d.toISOString().slice(0, 10);
        }

        dishes.push({
            id: Date.now() + Math.random() * 10000,
            name: name,
            status: statusSelect.value,
            date: date,
        });

        input.value = '';
        dateInput.value = '';
        saveDishes();
        renderTags();
        renderCalendar();
        updateSuggestion();
    });

    // ——— СТАРТ ———
    initDishes();
    renderCalendar();
    renderTags();
    updateSuggestion();

    // Устанавливаем дату по умолчанию в инпут
    const defaultDate = new Date();
    defaultDate.setDate(defaultDate.getDate() + 1);
    document.getElementById('newDishDate').value = defaultDate.toISOString().slice(0, 10);
</script>
</body>
</html>
