<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Умное меню · Календарь</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        :root {
            --bg-primary: #f5f3f0;
            --bg-app: rgba(255, 255, 255, 0.8);
            --bg-app-border: rgba(255, 255, 255, 0.4);
            --text-primary: #1c1c2a;
            --text-secondary: #4a4a5a;
            --text-muted: #6b6b7a;
            --cell-bg: rgba(255, 255, 255, 0.5);
            --cell-border: rgba(255, 255, 255, 0.7);
            --tag-bg: white;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --btn-bg: #1e1e2a;
            --btn-text: white;
            --input-bg: rgba(255, 255, 255, 0.7);
            --badge-bg: rgba(0, 0, 0, 0.05);
            --empty-border: rgba(0, 0, 0, 0.05);
            --planned-color: #fbbf24;
            --done-color: #34d399;
            --liked-color: #ef4444;
            --planned-bg: rgba(251, 191, 36, 0.15);
            --done-bg: rgba(52, 211, 153, 0.15);
            --modal-overlay: rgba(0, 0, 0, 0.4);
            --modal-bg: white;
            --day-hover: rgba(0, 0, 0, 0.04);
            --modal-text: #1c1c2a;
            --chip-bg: rgba(255, 255, 255, 0.7);
            --week-row-bg: rgba(255, 255, 255, 0.3);
            --menu-item-bg: rgba(255, 255, 255, 0.3);
            --suggest-item-bg: rgba(128, 128, 140, 0.06);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0f0f17;
                --bg-app: rgba(25, 25, 38, 0.92);
                --bg-app-border: rgba(255, 255, 255, 0.06);
                --text-primary: #ececf0;
                --text-secondary: #b0b0c8;
                --text-muted: #7a7a92;
                --cell-bg: rgba(40, 40, 56, 0.5);
                --cell-border: rgba(255, 255, 255, 0.05);
                --tag-bg: rgba(45, 45, 65, 0.7);
                --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
                --btn-bg: #3a3a52;
                --btn-text: #f0f0f5;
                --input-bg: rgba(45, 45, 65, 0.6);
                --badge-bg: rgba(255, 255, 255, 0.05);
                --empty-border: rgba(255, 255, 255, 0.03);
                --planned-color: #fcd34d;
                --done-color: #6ee7b7;
                --liked-color: #f87171;
                --planned-bg: rgba(252, 211, 77, 0.12);
                --done-bg: rgba(110, 231, 183, 0.12);
                --modal-overlay: rgba(0, 0, 0, 0.7);
                --modal-bg: #1e1e2e;
                --day-hover: rgba(255, 255, 255, 0.05);
                --modal-text: #ececf0;
                --chip-bg: rgba(45, 45, 65, 0.7);
                --week-row-bg: rgba(40, 40, 56, 0.5);
                --menu-item-bg: rgba(40, 40, 56, 0.5);
                --suggest-item-bg: rgba(60, 60, 80, 0.4);
            }
        }

        body {
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px;
            transition: background 0.3s;
        }

        .app {
            max-width: 960px;
            width: 100%;
            background: var(--bg-app);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 24px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--bg-app-border);
            transition: all 0.3s;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 620;
            letter-spacing: -0.3px;
            background: linear-gradient(145deg, var(--text-primary), var(--text-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logo span {
            font-size: 13px;
            color: var(--text-muted);
            background: var(--badge-bg);
            padding: 3px 12px;
            border-radius: 40px;
            margin-left: 8px;
            -webkit-text-fill-color: var(--text-muted);
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .view-toggle {
            display: flex;
            gap: 3px;
            background: rgba(128, 128, 140, 0.1);
            padding: 4px;
            border-radius: 40px;
        }

        .view-toggle button {
            border: none;
            background: transparent;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 550;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .view-toggle button.active {
            background: var(--tag-bg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            color: var(--text-primary);
        }

        .smart-btn-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .what-cook-btn {
            background: var(--btn-bg);
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            color: var(--btn-text);
            font-size: 16px;
            font-weight: 580;
            box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .what-cook-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.12);
        }

        .what-cook-btn:active {
            transform: scale(0.97);
        }

        .favorites-btn {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .favorites-btn:hover {
            background: var(--cell-bg);
        }

        .favorites-btn .heart {
            color: var(--liked-color);
        }

        .add-dish-btn {
            background: var(--done-color);
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: white;
            font-size: 14px;
            font-weight: 580;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(52, 211, 153, 0.3);
        }

        .add-dish-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.08);
        }

        /* ——— КАЛЕНДАРЬ (месяц) ——— */
        .calendar-wrap {
            background: rgba(128, 128, 140, 0.04);
            border-radius: 28px;
            padding: 10px 6px 14px;
            margin-bottom: 16px;
            touch-action: pan-y;
            user-select: none;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px 10px;
        }

        .calendar-header h2 {
            font-size: 18px;
            font-weight: 560;
            color: var(--text-primary);
        }

        .month-nav {
            display: flex;
            gap: 6px;
        }

        .month-nav button {
            background: var(--cell-bg);
            border: 1px solid var(--cell-border);
            border-radius: 30px;
            padding: 4px 14px;
            cursor: pointer;
            font-size: 18px;
            color: var(--text-primary);
            transition: 0.15s;
            line-height: 1.4;
        }

        .month-nav button:hover {
            background: var(--day-hover);
        }

        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 500;
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 0.3px;
            padding: 6px 0 4px;
            text-transform: uppercase;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day-cell {
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: var(--cell-bg);
            border: 1px solid var(--cell-border);
            cursor: pointer;
            transition: 0.15s;
            position: relative;
            min-height: 60px;
            padding: 6px 4px;
            width: 100%;
        }

        .day-cell:hover {
            background: var(--day-hover);
        }

        .day-cell.empty {
            background: transparent;
            border: 1px dashed var(--empty-border);
            cursor: default;
            pointer-events: none;
        }
        .day-cell.empty:hover {
            background: transparent;
        }

        .day-number {
            font-weight: 550;
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1;
            margin-bottom: 4px;
        }

        .day-cell.has-done {
            background: var(--done-bg);
            border-color: var(--done-color);
        }
        .day-cell.has-done .day-number {
            color: var(--done-color);
        }

        .day-cell.has-planned {
            background: var(--planned-bg);
            border-color: var(--planned-color);
        }
        .day-cell.has-planned .day-number {
            color: var(--planned-color);
        }

        .day-cell.has-both {
            background: linear-gradient(135deg, var(--done-bg) 50%, var(--planned-bg) 50%);
            border-color: var(--done-color);
        }

        .day-cell.today {
            border-color: var(--text-primary);
            border-width: 2px;
        }

        /* ——— НЕДЕЛЬНЫЙ СПИСОК (таблица) ——— */
        .week-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 4px 0;
        }

        .week-row {
            display: grid;
            grid-template-columns: 50px 80px 1fr;
            gap: 10px;
            align-items: center;
            background: var(--week-row-bg);
            border-radius: 14px;
            padding: 8px 12px;
            border: 1px solid var(--cell-border);
            cursor: pointer;
            transition: 0.15s;
        }

        .week-row:hover {
            background: var(--day-hover);
        }

        .week-row .date-col {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            text-align: center;
        }

        .week-row .day-col {
            font-weight: 500;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        .week-row .meals-col {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
        }

        .week-row .meal-chip {
            font-size: 13px;
            padding: 2px 10px;
            border-radius: 30px;
            background: var(--chip-bg);
            border-left: 3px solid var(--text-muted);
            color: var(--text-primary);
            white-space: nowrap;
        }

        .week-row .meal-chip.done {
            border-left-color: var(--done-color);
        }
        .week-row .meal-chip.planned {
            border-left-color: var(--planned-color);
        }
        .week-row .meal-chip.liked {
            border-left-color: var(--liked-color);
            background: rgba(239, 68, 68, 0.08);
        }

        .week-row .empty-meals {
            color: var(--text-muted);
            font-size: 13px;
            font-style: italic;
        }

        /* ——— ТЕКСТОВОЕ МЕНЮ (список под календарём) ——— */
        .menu-list {
            margin-top: 16px;
            background: rgba(128, 128, 140, 0.04);
            border-radius: 24px;
            padding: 14px 16px;
            max-height: 300px;
            overflow-y: auto;
        }

        .menu-list h3 {
            font-weight: 540;
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .menu-group {
            margin-bottom: 10px;
        }

        .menu-date {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 4px;
        }

        .menu-item {
            padding: 5px 12px;
            border-radius: 12px;
            background: var(--menu-item-bg);
            margin-bottom: 3px;
            font-size: 14px;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            border-left: 3px solid var(--text-muted);
        }

        .menu-item.done {
            border-left-color: var(--done-color);
        }
        .menu-item.planned {
            border-left-color: var(--planned-color);
        }

        .menu-item .status-badge {
            font-size: 12px;
            color: var(--text-muted);
        }

        .menu-empty {
            color: var(--text-muted);
            text-align: center;
            padding: 20px 0;
            font-size: 14px;
        }

        /* ——— МОДАЛКА ДНЯ ——— */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-overlay);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--modal-bg);
            border-radius: 32px;
            padding: 28px 24px;
            max-width: 540px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--cell-border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-header h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--modal-text);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0 8px;
            line-height: 1;
        }
        .modal-close:hover {
            color: var(--text-primary);
        }

        .modal-dish {
            padding: 10px 14px;
            border-radius: 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--cell-bg);
            border-left: 4px solid var(--text-muted);
            color: var(--modal-text);
            font-size: 15px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .modal-dish.done {
            border-left-color: var(--done-color);
        }
        .modal-dish.planned {
            border-left-color: var(--planned-color);
        }
        .modal-dish.liked {
            border-left-color: var(--liked-color);
        }

        .modal-dish .dish-name {
            flex: 1;
            min-width: 80px;
        }

        .modal-dish .dish-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .modal-dish .dish-status {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            margin-right: 4px;
        }

        .modal-dish .action-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            transition: 0.15s;
            color: var(--text-muted);
        }
        .modal-dish .action-btn:hover {
            transform: scale(1.2);
            color: var(--text-primary);
        }
        .modal-dish .delete-btn:hover {
            color: #e55a5a;
        }
        .modal-dish .like-btn {
            font-size: 20px;
        }
        .modal-dish .like-btn.liked {
            color: var(--liked-color);
        }

        .modal-empty {
            color: var(--text-muted);
            text-align: center;
            padding: 30px 0;
            font-size: 15px;
        }

        /* ——— СЕКЦИЯ ДОБАВЛЕНИЯ В МОДАЛКЕ ——— */
        .modal-add-section {
            margin-top: 20px;
            border-top: 1px solid var(--cell-border);
            padding-top: 16px;
        }

        .modal-add-section h4 {
            font-size: 15px;
            font-weight: 550;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .modal-add-new {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .modal-add-new input {
            flex: 2;
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid var(--cell-border);
            background: var(--input-bg);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            min-width: 120px;
        }

        .modal-add-new input:focus {
            border-color: var(--done-color);
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.15);
        }

        .modal-add-new select {
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid var(--cell-border);
            background: var(--input-bg);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
        }

        .modal-add-new button {
            background: var(--btn-bg);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: var(--btn-text);
            font-weight: 550;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
        }

        .modal-add-new button:hover {
            filter: brightness(1.12);
        }

        .modal-suggest-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .modal-suggest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: var(--suggest-item-bg);
            border-radius: 30px;
            cursor: pointer;
            transition: 0.15s;
            font-size: 14px;
            color: var(--text-primary);
        }

        .modal-suggest-item:hover {
            background: var(--day-hover);
        }

        .modal-suggest-item .suggest-name {
            font-weight: 500;
        }

        .modal-suggest-item .suggest-last {
            font-size: 12px;
            color: var(--text-muted);
        }

        .modal-no-suggest {
            color: var(--text-muted);
            font-size: 14px;
            font-style: italic;
            padding: 8px 0;
        }

        /* ——— МОДАЛКА ДОБАВЛЕНИЯ БЛЮДА (глобальная) ——— */
        .add-modal .modal {
            max-width: 400px;
        }

        .add-modal .form-group {
            margin-bottom: 16px;
        }

        .add-modal .form-group label {
            display: block;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .add-modal .form-group input,
        .add-modal .form-group select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 40px;
            border: 1px solid var(--cell-border);
            background: var(--input-bg);
            font-size: 15px;
            color: var(--text-primary);
            outline: none;
            transition: 0.15s;
        }

        .add-modal .form-group input:focus,
        .add-modal .form-group select:focus {
            border-color: var(--done-color);
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.15);
        }

        .add-modal .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .add-modal .form-actions button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 550;
            cursor: pointer;
            transition: 0.2s;
        }

        .add-modal .form-actions .btn-primary {
            background: var(--btn-bg);
            color: var(--btn-text);
        }

        .add-modal .form-actions .btn-primary:hover {
            filter: brightness(1.12);
        }

        .add-modal .form-actions .btn-secondary {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-primary);
        }

        .add-modal .form-actions .btn-secondary:hover {
            background: var(--cell-bg);
        }

        /* ——— МОДАЛКА ВЫБОРА "ЧТО ПРИГОТОВИТЬ?" ——— */
        .choice-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-overlay);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .choice-overlay.active {
            display: flex;
        }

        .choice-modal {
            background: var(--modal-bg);
            border-radius: 32px;
            padding: 32px 28px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--cell-border);
            text-align: center;
        }

        .choice-modal h2 {
            font-size: 24px;
            font-weight: 600;
            color: var(--modal-text);
            margin-bottom: 24px;
        }

        .choice-modal .choice-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border: none;
            border-radius: 60px;
            font-size: 18px;
            font-weight: 550;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 12px;
            background: var(--btn-bg);
            color: var(--btn-text);
            text-align: center;
        }

        .choice-modal .choice-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.12);
        }

        .choice-modal .choice-btn:active {
            transform: scale(0.97);
        }

        .choice-modal .choice-btn.secondary {
            background: transparent;
            border: 2px solid var(--text-muted);
            color: var(--text-primary);
        }

        .choice-modal .choice-btn.secondary:hover {
            background: var(--cell-bg);
        }

        .choice-modal .choice-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            text-decoration: underline;
        }

        .choice-modal .choice-close:hover {
            color: var(--text-primary);
        }

        /* ——— БЛОК ЛЮБИМЫХ ——— */
        .favorites-section {
            display: none;
            margin-top: 16px;
            background: rgba(128, 128, 140, 0.04);
            border-radius: 24px;
            padding: 14px 16px;
        }

        .favorites-section.active {
            display: block;
        }

        .favorites-section h3 {
            font-weight: 540;
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .favorites-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .fav-item {
            background: var(--tag-bg);
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 13px;
            border: 1px solid var(--cell-border);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-primary);
        }

        .fav-item .heart {
            color: var(--liked-color);
        }

        .hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 8px;
        }

        /* ——— АДАПТИВ ——— */
        @media (max-width: 700px) {
            .app { padding: 16px 12px; border-radius: 28px; }
            .day-cell { min-height: 50px; padding: 4px 2px; }
            .day-number { font-size: 13px; }
            .header { flex-direction: column; align-items: stretch; }
            .controls { justify-content: center; flex-wrap: wrap; }
            .logo h1 { font-size: 22px; text-align: center; }
            .logo span { display: inline-block; }
            .what-cook-btn { font-size: 15px; padding: 10px 20px; }
            .add-dish-btn { font-size: 13px; padding: 6px 14px; }
            .choice-modal { padding: 24px 18px; }
            .choice-modal .choice-btn { font-size: 16px; padding: 12px 16px; }

            .week-row {
                grid-template-columns: 40px 60px 1fr;
                gap: 6px;
                padding: 6px 10px;
            }
            .week-row .date-col { font-size: 14px; }
            .week-row .day-col { font-size: 12px; }
            .week-row .meal-chip { font-size: 12px; padding: 1px 8px; }
            .modal { padding: 20px 16px; max-width: 100%; }
            .modal-add-new { flex-direction: column; }
            .modal-add-new input, .modal-add-new select, .modal-add-new button { width: 100%; }
        }

        @media (max-width: 480px) {
            body { padding: 8px; }
            .app { padding: 12px 8px; border-radius: 24px; }
            .day-cell { min-height: 44px; border-radius: 14px; }
            .day-number { font-size: 12px; }
            .weekdays { font-size: 10px; }
            .calendar-header h2 { font-size: 16px; }
            .month-nav button { padding: 3px 12px; font-size: 16px; }
            .controls .view-toggle button { font-size: 11px; padding: 4px 10px; }
            .what-cook-btn { font-size: 14px; padding: 8px 16px; }
            .favorites-btn { font-size: 12px; padding: 6px 12px; }
            .add-dish-btn { font-size: 12px; padding: 5px 12px; }
            .modal { padding: 16px 12px; border-radius: 24px; }
            .modal-dish { font-size: 13px; padding: 8px 10px; }
            .choice-modal h2 { font-size: 20px; }

            .week-row {
                grid-template-columns: 30px 50px 1fr;
                gap: 4px;
                padding: 4px 8px;
                border-radius: 10px;
            }
            .week-row .date-col { font-size: 13px; }
            .week-row .day-col { font-size: 11px; }
            .week-row .meal-chip { font-size: 11px; padding: 1px 6px; }
        }

        @media (min-width: 1000px) {
            .day-cell { min-height: 70px; padding: 8px 6px; }
            .day-number { font-size: 16px; }
        }
    </style>
</head>
<body>

<div class="app">
    <div class="header">
        <div class="logo">
            <h1>🍽️ Меню <span>умное</span></h1>
        </div>
        <div class="controls">
            <div class="view-toggle" id="viewToggle">
                <button class="active" data-view="month">Месяц</button>
                <button data-view="week">Неделя</button>
            </div>
        </div>
    </div>

    <div class="smart-btn-wrap">
        <button class="what-cook-btn" id="suggestBtn">🤔 Что приготовить?</button>
        <button class="favorites-btn" id="favoritesToggle"><span class="heart">❤️</span> Любимые</button>
        <button class="add-dish-btn" id="addDishBtn">➕ Добавить блюдо</button>
    </div>

    <div class="calendar-wrap" id="calendarWrap">
        <div class="calendar-header">
            <button class="month-nav" id="prevMonth">‹</button>
            <h2 id="monthTitle">Август 2026</h2>
            <button class="month-nav" id="nextMonth">›</button>
        </div>
        <div id="calendarContent"></div>
    </div>

    <div class="menu-list" id="menuList">
        <h3>📋 Меню на <span id="menuPeriod">месяц</span></h3>
        <div id="menuContent"></div>
    </div>

    <div class="favorites-section" id="favoritesSection">
        <h3>❤️ Любимые блюда</h3>
        <div class="favorites-list" id="favoritesList"></div>
    </div>
</div>

<!-- МОДАЛКА ДНЯ -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal">
        <div class="modal-header">
            <h3 id="modalDate">26 августа 2026</h3>
            <button class="modal-close" id="modalClose">✕</button>
        </div>
        <div id="modalContent"></div>
    </div>
</div>

<!-- МОДАЛКА ДОБАВЛЕНИЯ БЛЮДА (глобальная) -->
<div class="modal-overlay add-modal" id="addModalOverlay">
    <div class="modal">
        <div class="modal-header">
            <h3>➕ Новое блюдо</h3>
            <button class="modal-close" id="addModalClose">✕</button>
        </div>
        <div class="form-group">
            <label for="newDishName">Название блюда</label>
            <input type="text" id="newDishName" placeholder="Например, Плов">
        </div>
        <div class="form-group">
            <label for="newDishDate">Дата</label>
            <input type="date" id="newDishDate">
        </div>
        <div class="form-group">
            <label for="newDishStatus">Статус</label>
            <select id="newDishStatus">
                <option value="done">✅ Уже готовила</option>
                <option value="planned">📅 Планирую</option>
            </select>
        </div>
        <div class="form-actions">
            <button class="btn-secondary" id="addModalCancel">Отмена</button>
            <button class="btn-primary" id="addModalSave">Сохранить</button>
        </div>
    </div>
</div>

<!-- МОДАЛКА ВЫБОРА "ЧТО ПРИГОТОВИТЬ?" -->
<div class="choice-overlay" id="choiceOverlay">
    <div class="choice-modal">
        <h2>🤔 Что приготовить?</h2>
        <button class="choice-btn" id="choiceFromMenu">🍳 Из моего меню</button>
        <button class="choice-btn secondary" id="choiceFromTaste">✨ На твой вкус</button>
        <button class="choice-close" id="choiceClose">Закрыть</button>
    </div>
</div>

<script>
    // ——— ДАННЫЕ ———
    const MY_DISHES = [
        { name: 'Гороховый суп', status: 'done', date: '2026-08-24' },
        { name: 'Запеканка из фарша и овощей', status: 'done', date: '2026-08-25' },
        { name: 'Колбаски и запеченая картошка', status: 'done', date: '2026-08-26' },
        { name: 'Плов', status: 'planned', date: '2026-08-28' },
        { name: 'Салат с крабовыми палочками', status: 'planned', date: '2026-08-28' },
        { name: 'Суп борщ?', status: 'planned', date: '2026-08-31' },
        { name: 'Котлеты с картофельным пюре', status: 'planned', date: '2026-09-01' },
        { name: 'Салат морковь по-корейски', status: 'planned', date: '2026-09-01' },
        { name: 'Печень и перловка', status: 'planned', date: '2026-09-02' },
        { name: 'Мясо по-французски', status: 'planned', date: '2026-09-03' },
        { name: 'Морская капуста с крабовыми палочками', status: 'planned', date: '2026-09-04' },
        { name: 'Суп с сайрой', status: 'planned', date: '2026-09-07' },
        { name: 'Тушеная капуста', status: 'planned', date: '2026-09-08' },
        { name: 'Запеченные куриные ножки', status: 'planned', date: '2026-09-09' },
        { name: 'Фунчоза', status: 'planned', date: '2026-09-09' },
        { name: 'Удон', status: 'planned', date: '2026-09-10' },
        { name: 'Паста Болоньезе', status: 'planned', date: '2026-09-12' },
    ];

    let dishes = [];
    let currentDate = new Date();
    let currentView = 'month';
    let showFavorites = false;

    function initDishes() {
        const saved = localStorage.getItem('smartMenuDishes_v3');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (parsed.length > 0) {
                    dishes = parsed;
                    return;
                }
            } catch(e) {}
        }

        const result = MY_DISHES.map((d, i) => ({ ...d, id: Date.now() + i, liked: false }));

        const noDate = [
            'Салат с морской капустой и крабовым мясом',
            'Гречка и салат из свежей капусты как в столовой',
            'Суп-пюре из кабачков'
        ];
        const today = new Date();
        noDate.forEach((name, idx) => {
            const d = new Date(today);
            d.setDate(d.getDate() + 7 + idx);
            result.push({
                id: Date.now() + 1000 + idx,
                name: name,
                status: 'planned',
                date: d.toISOString().slice(0, 10),
                liked: false
            });
        });

        dishes = result;
        saveDishes();
    }

    function saveDishes() {
        localStorage.setItem('smartMenuDishes_v3', JSON.stringify(dishes));
    }

    function getDishesForDate(dateStr) {
        return dishes.filter(d => d.date === dateStr);
    }

    function formatDate(date) {
        const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
        return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
    }

    function getWeekDays(baseDate) {
        const start = new Date(baseDate);
        start.setDate(start.getDate() - start.getDay() + 1);
        const week = [];
        for (let i = 0; i < 7; i++) {
            const d = new Date(start);
            d.setDate(start.getDate() + i);
            week.push(d);
        }
        return week;
    }

    // ——— РЕНДЕР КАЛЕНДАРЯ ———
    function renderCalendar() {
        const container = document.getElementById('calendarContent');
        const year = currentDate.getFullYear();
        const month = currentDate.getMonth();

        document.getElementById('monthTitle').textContent =
            `${['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][month]} ${year}`;

        container.innerHTML = '';

        if (currentView === 'month') {
            renderMonthView(container, year, month);
        } else {
            renderWeekView(container);
        }

        updateMenu();
        updateFavorites();
    }

    function renderMonthView(container, year, month) {
        const grid = document.createElement('div');
        grid.className = 'days-grid';

        const first = new Date(year, month, 1);
        const last = new Date(year, month + 1, 0);
        const totalDays = last.getDate();
        let startDay = first.getDay() - 1;
        if (startDay < 0) startDay = 6;

        for (let i = 0; i < startDay; i++) {
            const empty = document.createElement('div');
            empty.className = 'day-cell empty';
            grid.appendChild(empty);
        }

        const today = new Date();
        const todayStr = today.toISOString().slice(0, 10);

        for (let day = 1; day <= totalDays; day++) {
            const d = new Date(year, month, day);
            const dateStr = d.toISOString().slice(0, 10);
            const cell = createDayCell(d, dateStr, todayStr);
            grid.appendChild(cell);
        }

        container.appendChild(grid);
    }

    function createDayCell(date, dateStr, todayStr) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        const dayDishes = getDishesForDate(dateStr);
        const hasDone = dayDishes.some(d => d.status === 'done');
        const hasPlanned = dayDishes.some(d => d.status === 'planned');

        if (hasDone) cell.classList.add('has-done');
        if (hasPlanned) cell.classList.add('has-planned');
        if (hasDone && hasPlanned) cell.classList.add('has-both');
        if (dateStr === todayStr) cell.classList.add('today');

        const numDiv = document.createElement('div');
        numDiv.className = 'day-number';
        numDiv.textContent = date.getDate();
        cell.appendChild(numDiv);

        cell.addEventListener('click', () => {
            openModal(dateStr);
        });

        return cell;
    }

    function renderWeekView(container) {
        const week = getWeekDays(currentDate);
        const list = document.createElement('div');
        list.className = 'week-list';

        const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

        week.forEach((day, idx) => {
            const dateStr = day.toISOString().slice(0, 10);
            const dayDishes = getDishesForDate(dateStr);

            const row = document.createElement('div');
            row.className = 'week-row';

            const dateCol = document.createElement('div');
            dateCol.className = 'date-col';
            dateCol.textContent = `${day.getDate()}`;
            row.appendChild(dateCol);

            const dayCol = document.createElement('div');
            dayCol.className = 'day-col';
            dayCol.textContent = dayNames[idx];
            row.appendChild(dayCol);

            const mealsCol = document.createElement('div');
            mealsCol.className = 'meals-col';

            if (dayDishes.length === 0) {
                const empty = document.createElement('span');
                empty.className = 'empty-meals';
                empty.textContent = '—';
                mealsCol.appendChild(empty);
            } else {
                dayDishes.forEach(dish => {
                    const chip = document.createElement('span');
                    chip.className = `meal-chip ${dish.status}`;
                    if (dish.liked) chip.classList.add('liked');
                    chip.textContent = dish.name;
                    mealsCol.appendChild(chip);
                });
            }
            row.appendChild(mealsCol);

            row.addEventListener('click', () => {
                openModal(dateStr);
            });

            list.appendChild(row);
        });

        container.appendChild(list);
    }

    // ——— ТЕКСТОВОЕ МЕНЮ ———
    function updateMenu() {
        const container = document.getElementById('menuContent');
        const periodLabel = document.getElementById('menuPeriod');
        periodLabel.textContent = currentView === 'month' ? 'месяц' : 'неделя';

        let days = [];
        if (currentView === 'month') {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            const last = new Date(year, month + 1, 0);
            for (let d = 1; d <= last.getDate(); d++) {
                days.push(new Date(year, month, d));
            }
        } else {
            days = getWeekDays(currentDate);
        }

        const grouped = {};
        days.forEach(day => {
            const dateStr = day.toISOString().slice(0, 10);
            const dayDishes = getDishesForDate(dateStr);
            if (dayDishes.length > 0) {
                grouped[dateStr] = dayDishes;
            }
        });

        const sortedDates = Object.keys(grouped).sort();

        if (sortedDates.length === 0) {
            container.innerHTML = `<div class="menu-empty">😌 Нет блюд на этот период</div>`;
            return;
        }

        let html = '';
        sortedDates.forEach(dateStr => {
            const d = new Date(dateStr);
            const dayDishes = grouped[dateStr];
            const displayDate = formatDate(d);
            html += `<div class="menu-group">`;
            html += `<div class="menu-date">${displayDate}</div>`;
            dayDishes.forEach(dish => {
                const statusLabel = dish.status === 'done' ? '✅' : '📅';
                html += `
                    <div class="menu-item ${dish.status}">
                        <span>${dish.name}</span>
                        <span class="status-badge">${statusLabel}</span>
                    </div>
                `;
            });
            html += `</div>`;
        });

        container.innerHTML = html;
    }

    // ——— ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ———
    function getUniqueDishesWithLastDate() {
        const map = {};
        dishes.forEach(d => {
            if (!map[d.name] || d.date > map[d.name]) {
                map[d.name] = d.date;
            }
        });
        const result = Object.entries(map).map(([name, date]) => ({ name, lastDate: date }));
        result.sort((a, b) => a.lastDate.localeCompare(b.lastDate));
        return result;
    }

    function daysAgo(dateStr) {
        const today = new Date();
        const d = new Date(dateStr);
        const diff = Math.floor((today - d) / (1000 * 60 * 60 * 24));
        if (diff === 0) return 'сегодня';
        if (diff === 1) return 'вчера';
        if (diff < 7) return `${diff} дня назад`;
        if (diff < 14) return 'неделю назад';
        if (diff < 30) return `${Math.floor(diff / 7)} недели назад`;
        return `${diff} дней назад`;
    }

    // ——— МОДАЛКА ДНЯ ———
    function openModal(dateStr) {
        const overlay = document.getElementById('modalOverlay');
        const modalDate = document.getElementById('modalDate');
        const content = document.getElementById('modalContent');

        const d = new Date(dateStr);
        modalDate.textContent = formatDate(d);

        const dayDishes = getDishesForDate(dateStr);

        let html = '';

        // Список блюд на день
        if (dayDishes.length === 0) {
            html += `<div class="modal-empty">😌 На этот день пока ничего нет</div>`;
        } else {
            dayDishes.forEach(dish => {
                const statusLabel = dish.status === 'done' ? '✅ Готовила' : '📅 Планирую';
                html += `
                    <div class="modal-dish ${dish.status} ${dish.liked ? 'liked' : ''}">
                        <span class="dish-name">${dish.name}</span>
                        <div class="dish-actions">
                            <span class="dish-status">${statusLabel}</span>
                            <button class="action-btn like-btn ${dish.liked ? 'liked' : ''}" data-id="${dish.id}" title="Лайк">${dish.liked ? '❤️' : '🤍'}</button>
                            <button class="action-btn toggle-status-btn" data-id="${dish.id}" title="Переключить статус">🔄</button>
                            <button class="action-btn delete-btn" data-id="${dish.id}" title="Удалить">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        // Блок добавления нового блюда
        html += `
            <div class="modal-add-section">
                <h4>➕ Добавить блюдо</h4>
                <div class="modal-add-new">
                    <input type="text" id="modalNewDishName" placeholder="Название блюда">
                    <select id="modalNewDishStatus">
                        <option value="planned">📅 Планирую</option>
                        <option value="done">✅ Готовила</option>
                    </select>
                    <button id="modalAddDishBtn">Добавить</button>
                </div>
                <h4 style="margin-top: 10px;">📖 Выбрать из меню</h4>
                <div class="modal-suggest-list" id="modalSuggestList">
        `;

        const uniqueDishes = getUniqueDishesWithLastDate();
        const existingNames = dayDishes.map(d => d.name);
        const available = uniqueDishes.filter(item => !existingNames.includes(item.name));

        if (available.length === 0) {
            html += `<div class="modal-no-suggest">Все блюда уже добавлены на этот день</div>`;
        } else {
            available.forEach(item => {
                const lastText = item.lastDate ? `Последний раз: ${daysAgo(item.lastDate)}` : 'Никогда не готовила';
                html += `
                    <div class="modal-suggest-item" data-name="${item.name}">
                        <span class="suggest-name">${item.name}</span>
                        <span class="suggest-last">${lastText}</span>
                    </div>
                `;
            });
        }

        html += `</div></div>`;

        content.innerHTML = html;

        // ——— ОБРАБОТЧИКИ ———

        // Лайк
        content.querySelectorAll('.like-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = Number(this.dataset.id);
                const dish = dishes.find(d => d.id === id);
                if (dish) {
                    dish.liked = !dish.liked;
                    saveDishes();
                    renderCalendar();
                    openModal(dateStr);
                }
            });
        });

        // Переключение статуса
        content.querySelectorAll('.toggle-status-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = Number(this.dataset.id);
                const dish = dishes.find(d => d.id === id);
                if (dish) {
                    dish.status = dish.status === 'done' ? 'planned' : 'done';
                    saveDishes();
                    renderCalendar();
                    openModal(dateStr);
                }
            });
        });

        // Удаление
        content.querySelectorAll('.delete-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.stopPropagation();
                const id = Number(this.dataset.id);
                if (confirm('Удалить это блюдо?')) {
                    dishes = dishes.filter(d => d.id !== id);
                    saveDishes();
                    renderCalendar();
                    openModal(dateStr);
                }
            });
        });

        // Добавление нового блюда через форму в модалке
        const addBtn = document.getElementById('modalAddDishBtn');
        const nameInput = document.getElementById('modalNewDishName');
        const statusSelect = document.getElementById('modalNewDishStatus');

        if (addBtn) {
            addBtn.addEventListener('click', function() {
                const name = nameInput.value.trim();
                if (!name) {
                    alert('Введи название блюда');
                    return;
                }
                const status = statusSelect.value;
                dishes.push({
                    id: Date.now() + Math.random() * 10000,
                    name: name,
                    status: status,
                    date: dateStr,
                    liked: false,
                });
                saveDishes();
                renderCalendar();
                openModal(dateStr);
                nameInput.value = '';
            });
        }

        // Клик по предложенному блюду из списка
        content.querySelectorAll('.modal-suggest-item').forEach(item => {
            item.addEventListener('click', function() {
                const name = this.dataset.name;
                dishes.push({
                    id: Date.now() + Math.random() * 10000,
                    name: name,
                    status: 'planned',
                    date: dateStr,
                    liked: false,
                });
                saveDishes();
                renderCalendar();
                openModal(dateStr);
            });
        });

        overlay.classList.add('active');
    }

    document.getElementById('modalClose').addEventListener('click', () => {
        document.getElementById('modalOverlay').classList.remove('active');
    });

    document.getElementById('modalOverlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
            document.getElementById('modalOverlay').classList.remove('active');
        }
    });

    // ——— МОДАЛКА ДОБАВЛЕНИЯ БЛЮДА (глобальная) ———
    const addModalOverlay = document.getElementById('addModalOverlay');
    const addModalClose = document.getElementById('addModalClose');
    const addModalCancel = document.getElementById('addModalCancel');
    const addModalSave = document.getElementById('addModalSave');

    document.getElementById('addDishBtn').addEventListener('click', () => {
        const defaultDate = new Date();
        defaultDate.setDate(defaultDate.getDate() + 1);
        document.getElementById('newDishDate').value = defaultDate.toISOString().slice(0, 10);
        document.getElementById('newDishName').value = '';
        document.getElementById('newDishStatus').value = 'planned';
        addModalOverlay.classList.add('active');
    });

    function closeAddModal() {
        addModalOverlay.classList.remove('active');
    }

    addModalClose.addEventListener('click', closeAddModal);
    addModalCancel.addEventListener('click', closeAddModal);
    addModalOverlay.addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeAddModal();
    });

    addModalSave.addEventListener('click', function() {
        const nameInput = document.getElementById('newDishName');
        const dateInput = document.getElementById('newDishDate');
        const statusSelect = document.getElementById('newDishStatus');
        const name = nameInput.value.trim();
        if (!name) {
            alert('Введи название блюда');
            return;
        }
        let date = dateInput.value;
        if (!date) {
            const d = new Date();
            d.setDate(d.getDate() + 1);
            date = d.toISOString().slice(0, 10);
        }

        dishes.push({
            id: Date.now() + Math.random() * 10000,
            name: name,
            status: statusSelect.value,
            date: date,
            liked: false,
        });

        saveDishes();
        renderCalendar();
        updateFavorites();
        closeAddModal();
        nameInput.value = '';
    });

    // ——— МОДАЛКА ВЫБОРА "ЧТО ПРИГОТОВИТЬ?" ———
    const choiceOverlay = document.getElementById('choiceOverlay');
    const choiceFromMenu = document.getElementById('choiceFromMenu');
    const choiceFromTaste = document.getElementById('choiceFromTaste');
    const choiceClose = document.getElementById('choiceClose');

    document.getElementById('suggestBtn').addEventListener('click', () => {
        choiceOverlay.classList.add('active');
    });

    function closeChoice() {
        choiceOverlay.classList.remove('active');
    }

    choiceClose.addEventListener('click', closeChoice);
    choiceOverlay.addEventListener('click', (e) => {
        if (e.target === e.currentTarget) closeChoice();
    });

    choiceFromMenu.addEventListener('click', function() {
        closeChoice();
        const result = suggestDish();
        if (result.dish) {
            alert(`🍽️ Предлагаю: ${result.dish.name}\n\n${result.reason}`);
        } else {
            alert(`❌ ${result.reason}`);
        }
    });

    choiceFromTaste.addEventListener('click', function() {
        closeChoice();
        alert('✨ Функция «На твой вкус» будет доступна после загрузки ваших любимых блюд.\nЗагрузите их позже в разделе «Любимые».');
    });

    // ——— ЛОГИКА ПРЕДЛОЖЕНИЯ ———
    function suggestDish() {
        const doneDishes = dishes.filter(d => d.status === 'done');
        if (doneDishes.length === 0) {
            const planned = dishes.filter(d => d.status === 'planned');
            if (planned.length > 0) {
                const random = planned[Math.floor(Math.random() * planned.length)];
                return { dish: random, reason: 'Нет истории, но есть план! 😉' };
            }
            return { dish: null, reason: 'Добавь блюда!' };
        }

        const lastCooked = {};
        doneDishes.forEach(d => {
            if (!lastCooked[d.name] || d.date > lastCooked[d.name]) {
                lastCooked[d.name] = d.date;
            }
        });

        let oldestName = null;
        let oldestDate = null;
        for (const [name, date] of Object.entries(lastCooked)) {
            if (!oldestDate || date < oldestDate) {
                oldestDate = date;
                oldestName = name;
            }
        }

        const candidate = doneDishes.find(d => d.name === oldestName && d.date === oldestDate);
        if (candidate) {
            const today = new Date();
            const lastDate = new Date(candidate.date);
            const diffDays = Math.floor((today - lastDate) / (1000 * 60 * 60 * 24));
            let reason = `Не готовила "${candidate.name}" ${diffDays} дн.`;
            if (diffDays > 30) reason = `🔥 Давно не было "${candidate.name}" (${diffDays} дн.)!`;
            else if (diffDays > 14) reason = `⏳ "${candidate.name}" ждал ${diffDays} дн.`;
            else reason = `🥘 "${candidate.name}" — отличный вариант (${diffDays} дн.)`;
            return { dish: candidate, reason };
        }

        const fallback = dishes[Math.floor(Math.random() * dishes.length)];
        if (fallback) return { dish: fallback, reason: 'Попробуй что-то новенькое!' };
        return { dish: null, reason: 'Добавь блюда!' };
    }

    // ——— БЛОК ЛЮБИМЫХ ———
    document.getElementById('favoritesToggle').addEventListener('click', function() {
        showFavorites = !showFavorites;
        const section = document.getElementById('favoritesSection');
        section.classList.toggle('active', showFavorites);
        if (showFavorites) updateFavorites();
    });

    function updateFavorites() {
        const container = document.getElementById('favoritesList');
        const favs = dishes.filter(d => d.liked);
        if (favs.length === 0) {
            container.innerHTML = '<span style="color: var(--text-muted); font-size: 14px;">Нет любимых блюд</span>';
        } else {
            container.innerHTML = favs.map(d => `
                <span class="fav-item">
                    <span class="heart">❤️</span> ${d.name}
                </span>
            `).join('');
        }
    }

    // ——— НАВИГАЦИЯ ———
    function changePeriod(delta) {
        if (currentView === 'month') {
            currentDate.setMonth(currentDate.getMonth() + delta);
        } else {
            currentDate.setDate(currentDate.getDate() + delta * 7);
        }
        renderCalendar();
    }

    document.getElementById('prevMonth').addEventListener('click', () => changePeriod(-1));
    document.getElementById('nextMonth').addEventListener('click', () => changePeriod(1));

    // ——— СВАЙП ———
    let touchStartX = 0;
    let touchEndX = 0;
    const wrap = document.getElementById('calendarWrap');

    wrap.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    wrap.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) > 50) {
            changePeriod(diff > 0 ? 1 : -1);
        }
    }, { passive: true });

    // Поддержка мыши (drag)
    let mouseDown = false;
    let mouseStartX = 0;
    wrap.addEventListener('mousedown', (e) => {
        mouseDown = true;
        mouseStartX = e.screenX;
    });
    window.addEventListener('mouseup', (e) => {
        if (mouseDown) {
            const diff = mouseStartX - e.screenX;
            if (Math.abs(diff) > 50) {
                changePeriod(diff > 0 ? 1 : -1);
            }
            mouseDown = false;
        }
    });

    // ——— ПЕРЕКЛЮЧЕНИЕ ВИДОВ ———
    document.querySelectorAll('#viewToggle button').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('#viewToggle button').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentView = this.dataset.view;
            renderCalendar();
        });
    });

    // ——— СТАРТ ———
    initDishes();
    renderCalendar();
    updateFavorites();
</script>
</body>
</html>
