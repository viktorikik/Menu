<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>Меню · Календарь</title>
  <style>
    /* ===== Базовые переменные и стили ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    }

    :root {
      --bg-primary: #f5f3f0;
      --bg-app: rgba(255, 255, 255, 0.8);
      --bg-app-border: rgba(255, 255, 255, 0.4);
      --text-primary: #1c1c2a;
      --text-secondary: #4a4a5a;
      --text-muted: #6b6b7a;
      --cell-bg: rgba(255, 255, 255, 0.5);
      --cell-border: rgba(255, 255, 255, 0.7);
      --tag-bg: white;
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      --btn-bg: #1e1e2a;
      --btn-text: white;
      --input-bg: rgba(255, 255, 255, 0.7);
      --badge-bg: rgba(0, 0, 0, 0.05);
      --empty-border: rgba(0, 0, 0, 0.05);
      --planned-color: #fbbf24;
      --done-color: #34d399;
      --liked-color: #ef4444;
      --planned-bg: rgba(251, 191, 36, 0.15);
      --done-bg: rgba(52, 211, 153, 0.15);
      --modal-overlay: rgba(0, 0, 0, 0.4);
      --modal-bg: white;
      --day-hover: rgba(0, 0, 0, 0.04);
      --modal-text: #1c1c2a;
      --chip-bg: rgba(255, 255, 255, 0.7);
      --week-row-bg: rgba(255, 255, 255, 0.3);
      --menu-item-bg: rgba(255, 255, 255, 0.3);
      --suggest-item-bg: rgba(128, 128, 140, 0.06);
      --rec-item-bg: rgba(128, 128, 140, 0.06);
      --color-soup: #fbbf24;
      --color-salad: #34d399;
      --color-main: #ef4444;
      --search-bg: rgba(255,255,255,0.7);
      --search-border: #ddd;
    }

    body.dark-theme {
      --bg-primary: #0f0f17;
      --bg-app: rgba(25, 25, 38, 0.92);
      --bg-app-border: rgba(255, 255, 255, 0.06);
      --text-primary: #ececf0;
      --text-secondary: #b0b0c8;
      --text-muted: #7a7a92;
      --cell-bg: rgba(40, 40, 56, 0.5);
      --cell-border: rgba(255, 255, 255, 0.05);
      --tag-bg: rgba(45, 45, 65, 0.7);
      --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
      --btn-bg: #3a3a52;
      --btn-text: #f0f0f5;
      --input-bg: rgba(45, 45, 65, 0.6);
      --badge-bg: rgba(255, 255, 255, 0.05);
      --empty-border: rgba(255, 255, 255, 0.03);
      --planned-color: #fcd34d;
      --done-color: #6ee7b7;
      --liked-color: #f87171;
      --planned-bg: rgba(252, 211, 77, 0.12);
      --done-bg: rgba(110, 231, 183, 0.12);
      --modal-overlay: rgba(0, 0, 0, 0.7);
      --modal-bg: #1e1e2e;
      --day-hover: rgba(255, 255, 255, 0.05);
      --modal-text: #ececf0;
      --chip-bg: rgba(45, 45, 65, 0.7);
      --week-row-bg: rgba(40, 40, 56, 0.5);
      --menu-item-bg: rgba(40, 40, 56, 0.5);
      --suggest-item-bg: rgba(60, 60, 80, 0.4);
      --rec-item-bg: rgba(60, 60, 80, 0.4);
      --color-soup: #fbbf24;
      --color-salad: #34d399;
      --color-main: #f87171;
      --search-bg: rgba(45,45,65,0.6);
      --search-border: rgba(255,255,255,0.1);
    }

    body {
      background: var(--bg-primary);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 12px;
      transition: background 0.3s, color 0.3s;
    }

    .app {
      max-width: 960px;
      width: 100%;
      background: var(--bg-app);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 40px;
      padding: 24px 20px;
      box-shadow: var(--shadow);
      border: 1px solid var(--bg-app-border);
      transition: all 0.3s;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo h1 {
      font-size: 24px;
      font-weight: 620;
      letter-spacing: -0.3px;
      color: var(--text-primary);
    }
    .logo h1 span {
      font-size: 13px;
      color: var(--text-muted);
      background: var(--badge-bg);
      padding: 3px 12px;
      border-radius: 40px;
      margin-left: 8px;
      font-weight: 400;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    /* Переключатель темы */
    .theme-toggle {
      background: var(--cell-bg);
      border: 1px solid var(--cell-border);
      border-radius: 30px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1.4;
      color: var(--text-primary);
      transition: 0.2s;
    }
    .theme-toggle:hover {
      background: var(--day-hover);
    }

    .view-toggle {
      display: flex;
      gap: 3px;
      background: rgba(128, 128, 140, 0.1);
      padding: 4px;
      border-radius: 40px;
    }
    .view-toggle button {
      border: none;
      background: transparent;
      padding: 6px 14px;
      border-radius: 30px;
      font-weight: 550;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }
    .view-toggle button.active {
      background: var(--tag-bg);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      color: var(--text-primary);
    }

    .smart-btn-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .what-cook-btn, .favorites-btn, .add-dish-btn {
      /* стили уже есть, оставляем без изменений */
    }

    /* Календарь (без изменений) */
    .calendar-wrap { /* ... */ }
    .calendar-header { /* ... */ }
    .month-nav button { /* ... */ }
    .today-btn { /* ... */ }
    .weekdays { /* ... */ }
    .days-grid { /* ... */ }
    .day-cell { /* ... */ }
    .day-number { /* ... */ }

    /* Недельный вид – делаем блюда перетаскиваемыми */
    .week-row .meals-col {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 8px;
      min-height: 30px;
      padding: 2px 0;
    }
    .meal-chip {
      font-size: 13px;
      padding: 2px 10px;
      border-radius: 30px;
      background: var(--chip-bg);
      border-left: 3px solid var(--text-muted);
      color: var(--text-primary);
      white-space: nowrap;
      cursor: grab;
      transition: 0.15s;
      user-select: none;
    }
    .meal-chip:active {
      cursor: grabbing;
    }
    .meal-chip.dragging {
      opacity: 0.4;
    }
    .week-row.drag-over {
      background: var(--done-bg);
      border-color: var(--done-color);
    }
    .week-row .empty-meals {
      color: var(--text-muted);
      font-size: 13px;
      font-style: italic;
      padding: 4px 0;
    }

    /* Поиск и фильтрация */
    .search-filter-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      margin-bottom: 8px;
      align-items: center;
    }
    .search-filter-wrap input,
    .search-filter-wrap select {
      padding: 6px 12px;
      border-radius: 30px;
      border: 1px solid var(--cell-border);
      background: var(--search-bg);
      font-size: 14px;
      color: var(--text-primary);
      outline: none;
      flex: 1 1 150px;
    }
    .search-filter-wrap input:focus,
    .search-filter-wrap select:focus {
      border-color: var(--done-color);
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.15);
    }
    .search-filter-wrap label {
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
    }

    /* Остальные стили (модалки, адаптив) уже были, их не трогаем */
    /* Я оставлю их, но в целях экономии места не буду повторять полностью, 
       так как они уже есть в предыдущей версии. В финальном коде они будут. */

    /* ... весь остальной CSS из предыдущей версии ... */
    /* (в финальном ответе я дам полный файл, здесь только изменения) */

  </style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="logo">
      <h1>🍽️ Меню <span>планировщик</span></h1>
    </div>
    <div class="controls">
      <!-- Переключатель темы -->
      <button class="theme-toggle" id="themeToggle" title="Переключить тему">🌓</button>
      <div class="view-toggle" id="viewToggle">
        <button class="active" data-view="month">Месяц</button>
        <button data-view="week">Неделя</button>
      </div>
    </div>
  </div>

  <div class="smart-btn-wrap">
    <button class="what-cook-btn" id="suggestBtn">🤔 Что приготовить?</button>
    <button class="favorites-btn" id="favoritesBtn"><span class="heart">❤️</span> Любимые</button>
    <button class="add-dish-btn" id="addDishBtn">➕ Добавить блюдо</button>
  </div>

  <div class="calendar-wrap" id="calendarWrap">
    <div class="calendar-header">
      <div class="nav-group">
        <div class="month-nav">
          <button id="prevMonth">‹</button>
          <button id="nextMonth">›</button>
        </div>
        <button class="today-btn" id="todayBtn">Сегодня</button>
      </div>
      <h2 id="monthTitle">Август 2026</h2>
    </div>
    <div id="calendarContent"></div>
  </div>

  <!-- Поиск и фильтрация над меню -->
  <div class="search-filter-wrap">
    <input type="text" id="searchInput" placeholder="🔍 Поиск блюда...">
    <select id="statusFilter">
      <option value="all">Все статусы</option>
      <option value="done">✅ Готовила</option>
      <option value="planned">📅 Планирую</option>
    </select>
    <select id="categoryFilter">
      <option value="all">Все категории</option>
      <option value="soup">Супы</option>
      <option value="salad">Салаты</option>
      <option value="main">Основные</option>
      <option value="other">Другое</option>
    </select>
  </div>

  <div class="menu-list" id="menuList">
    <h3>📋 Меню на <span id="menuPeriod">месяц</span></h3>
    <div id="menuContent"></div>
  </div>
</div>

<!-- МОДАЛКА ДНЯ (без изменений) -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalDate">26 августа 2026</h3>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<!-- МОДАЛКА РЕКОМЕНДАЦИЙ / ЛЮБИМЫХ -->
<div class="modal-overlay rec-modal" id="recOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="recTitle">Рекомендации</h3>
      <button class="modal-close" id="recClose">✕</button>
    </div>
    <div id="recContent"></div>
  </div>
</div>

<!-- МОДАЛКА ДОБАВЛЕНИЯ (глобальная) -->
<div class="modal-overlay add-modal" id="addModalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3>➕ Новое блюдо</h3>
      <button class="modal-close" id="addModalClose">✕</button>
    </div>
    <div class="form-group">
      <label for="newDishName">Название блюда</label>
      <input type="text" id="newDishName" placeholder="Например, Плов">
    </div>
    <div class="form-group">
      <label for="newDishDate">Дата</label>
      <input type="date" id="newDishDate">
    </div>
    <div class="form-group">
      <label for="newDishStatus">Статус</label>
      <select id="newDishStatus">
        <option value="done">✅ Уже готовила</option>
        <option value="planned">📅 Планирую</option>
      </select>
    </div>
    <div class="form-actions">
      <button class="btn-secondary" id="addModalCancel">Отмена</button>
      <button class="btn-primary" id="addModalSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- МОДАЛКА ВЫБОРА "ЧТО ПРИГОТОВИТЬ?" -->
<div class="choice-overlay" id="choiceOverlay">
  <div class="choice-modal">
    <h2>🤔 Что приготовить?</h2>
    <button class="choice-btn" id="choiceFromMenu">🍳 Из моего меню</button>
    <button class="choice-btn secondary" id="choiceFromTaste">✨ На твой вкус</button>
    <button class="choice-close" id="choiceClose">Закрыть</button>
  </div>
</div>

<script>
  // ============================================================
  // ДАННЫЕ (без изменений)
  // ============================================================
  const MY_DISHES = [
    { name: 'Гороховый суп', status: 'done', date: '2026-08-24' },
    { name: 'Запеканка из фарша и овощей', status: 'done', date: '2026-08-25' },
    { name: 'Колбаски и запеченая картошка', status: 'done', date: '2026-08-26' },
    { name: 'Плов', status: 'planned', date: '2026-08-28' },
    { name: 'Салат с крабовыми палочками', status: 'planned', date: '2026-08-28' },
    { name: 'Суп борщ?', status: 'planned', date: '2026-08-31' },
    { name: 'Котлеты с картофельным пюре', status: 'planned', date: '2026-09-01' },
    { name: 'Салат морковь по-корейски', status: 'planned', date: '2026-09-01' },
    { name: 'Печень и перловка', status: 'planned', date: '2026-09-02' },
    { name: 'Мясо по-французски', status: 'planned', date: '2026-09-03' },
    { name: 'Морская капуста с крабовыми палочками', status: 'planned', date: '2026-09-04' },
    { name: 'Суп с сайрой', status: 'planned', date: '2026-09-07' },
    { name: 'Тушеная капуста', status: 'planned', date: '2026-09-08' },
    { name: 'Запеченные куриные ножки', status: 'planned', date: '2026-09-09' },
    { name: 'Фунчоза', status: 'planned', date: '2026-09-09' },
    { name: 'Удон', status: 'planned', date: '2026-09-10' },
    { name: 'Паста Болоньезе', status: 'planned', date: '2026-09-12' },
  ];

  let dishes = [];
  let currentDate = new Date();
  let currentView = 'month';

  // Фильтры
  let searchQuery = '';
  let statusFilter = 'all';
  let categoryFilter = 'all';

  // ============================================================
  // ИНИЦИАЛИЗАЦИЯ ДАННЫХ (без изменений)
  // ============================================================
  function initDishes() {
    const saved = localStorage.getItem('smartMenuDishes_v3');
    if (saved) {
      try {
        const parsed = JSON.parse(saved);
        if (parsed.length > 0) {
          dishes = parsed;
          return;
        }
      } catch(e) {}
    }
    const result = MY_DISHES.map((d, i) => ({ ...d, id: Date.now() + i, liked: false }));
    const noDate = ['Салат с морской капустой и крабовым мясом','Гречка и салат из свежей капусты как в столовой','Суп-пюре из кабачков'];
    const today = new Date();
    noDate.forEach((name, idx) => {
      const d = new Date(today);
      d.setDate(d.getDate() + 7 + idx);
      result.push({ id: Date.now() + 1000 + idx, name, status: 'planned', date: d.toISOString().slice(0, 10), liked: false });
    });
    dishes = result;
    saveDishes();
  }

  function saveDishes() {
    localStorage.setItem('smartMenuDishes_v3', JSON.stringify(dishes));
  }

  function getDishesForDate(dateStr) {
    return dishes.filter(d => d.date === dateStr);
  }

  // ============================================================
  // УТИЛИТЫ (без изменений)
  // ============================================================
  function formatDate(date) {
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
  }

  function getWeekDays(baseDate) {
    const start = new Date(baseDate);
    start.setDate(start.getDate() - start.getDay() + 1);
    const week = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(start);
      d.setDate(start.getDate() + i);
      week.push(d);
    }
    return week;
  }

  function daysAgo(dateStr) {
    const today = new Date();
    const d = new Date(dateStr);
    const diff = Math.floor((today - d) / (1000 * 60 * 60 * 24));
    if (diff === 0) return 'сегодня';
    if (diff === 1) return 'вчера';
    if (diff < 7) return `${diff} дня назад`;
    if (diff < 14) return 'неделю назад';
    if (diff < 30) return `${Math.floor(diff / 7)} недели назад`;
    return `${diff} дней назад`;
  }

  function getCategory(name) {
    const lower = name.toLowerCase();
    if (lower.includes('суп') || lower.includes('борщ') || lower.includes('пюре') || lower.includes('бульон')) return 'soup';
    if (lower.includes('салат') || lower.includes('винегрет') || lower.includes('овощ') || lower.includes('зелень')) return 'salad';
    if (lower.includes('котлет') || lower.includes('запекан') || lower.includes('тушен') || 
        lower.includes('колбас') || lower.includes('жарен') || lower.includes('печень') || 
        lower.includes('мясо') || lower.includes('курин') || lower.includes('индей') || 
        lower.includes('рыб') || lower.includes('бифштекс') || lower.includes('стейк') || 
        lower.includes('паста') || lower.includes('макарон') || lower.includes('греч') || 
        lower.includes('рис') || lower.includes('плов') || lower.includes('картош') || 
        lower.includes('каш')) return 'main';
    return 'other';
  }

  // ============================================================
  // НОВЫЕ ФУНКЦИИ: редактирование названия
  // ============================================================
  function editDishName(id, newName) {
    const dish = dishes.find(d => d.id === id);
    if (!dish) return false;
    dish.name = newName.trim();
    saveDishes();
    return true;
  }

  // ============================================================
  // НОВЫЕ ФУНКЦИИ: перетаскивание (drag & drop)
  // ============================================================
  let draggedDishId = null;
  let draggedFromDate = null;

  function initDragDrop() {
    document.addEventListener('dragstart', function(e) {
      const target = e.target.closest('.meal-chip');
      if (!target) return;
      const id = Number(target.dataset.id);
      const date = target.dataset.date;
      draggedDishId = id;
      draggedFromDate = date;
      target.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(id));
    });

    document.addEventListener('dragend', function(e) {
      const target = e.target.closest('.meal-chip');
      if (target) target.classList.remove('dragging');
      document.querySelectorAll('.week-row.drag-over').forEach(row => row.classList.remove('drag-over'));
    });

    document.addEventListener('dragover', function(e) {
      const row = e.target.closest('.week-row');
      if (!row) return;
      e.preventDefault();
      row.classList.add('drag-over');
    });

    document.addEventListener('dragleave', function(e) {
      const row = e.target.closest('.week-row');
      if (row) row.classList.remove('drag-over');
    });

    document.addEventListener('drop', function(e) {
      const row = e.target.closest('.week-row');
      if (!row) return;
      e.preventDefault();
      row.classList.remove('drag-over');
      const targetDate = row.dataset.date;
      if (!targetDate || !draggedDishId || draggedFromDate === targetDate) {
        draggedDishId = null;
        draggedFromDate = null;
        return;
      }
      const dish = dishes.find(d => d.id === draggedDishId);
      if (dish) {
        dish.date = targetDate;
        saveDishes();
        renderAll();
      }
      draggedDishId = null;
      draggedFromDate = null;
    });
  }

  // ============================================================
  // РЕНДЕРИНГ (с учётом фильтров)
  // ============================================================
  function renderAll() {
    renderCalendar();
    renderMenu();
  }

  function renderCalendar() {
    const container = document.getElementById('calendarContent');
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();
    document.getElementById('monthTitle').textContent = 
      `${['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][month]} ${year}`;

    container.innerHTML = '';
    if (currentView === 'month') {
      renderMonthView(container, year, month);
    } else {
      renderWeekView(container);
    }
  }

  function renderMonthView(container, year, month) {
    const grid = document.createElement('div');
    grid.className = 'days-grid';
    const first = new Date(year, month, 1);
    const last = new Date(year, month + 1, 0);
    const totalDays = last.getDate();
    let startDay = first.getDay() - 1;
    if (startDay < 0) startDay = 6;

    for (let i = 0; i < startDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      grid.appendChild(empty);
    }

    const today = new Date();
    const todayStr = today.toISOString().slice(0, 10);

    for (let day = 1; day <= totalDays; day++) {
      const d = new Date(year, month, day);
      const dateStr = d.toISOString().slice(0, 10);
      const cell = createDayCell(d, dateStr, todayStr);
      grid.appendChild(cell);
    }
    container.appendChild(grid);
  }

  function createDayCell(date, dateStr, todayStr) {
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    const dayDishes = getDishesForDate(dateStr);
    const hasDone = dayDishes.some(d => d.status === 'done');
    const hasPlanned = dayDishes.some(d => d.status === 'planned');
    if (hasDone) cell.classList.add('has-done');
    if (hasPlanned) cell.classList.add('has-planned');
    if (hasDone && hasPlanned) cell.classList.add('has-both');
    if (dateStr === todayStr) cell.classList.add('today');

    const numDiv = document.createElement('div');
    numDiv.className = 'day-number';
    numDiv.textContent = date.getDate();
    cell.appendChild(numDiv);

    cell.addEventListener('click', () => openModal(dateStr));
    return cell;
  }

  // ============================================================
  // НЕДЕЛЬНЫЙ ВИД С ПОДДЕРЖКОЙ DRAG & DROP
  // ============================================================
  function renderWeekView(container) {
    const week = getWeekDays(currentDate);
    const list = document.createElement('div');
    list.className = 'week-list';

    const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

    week.forEach((day, idx) => {
      const dateStr = day.toISOString().slice(0, 10);
      const dayDishes = getDishesForDate(dateStr);

      const row = document.createElement('div');
      row.className = 'week-row';
      row.dataset.date = dateStr;

      const dateCol = document.createElement('div');
      dateCol.className = 'date-col';
      dateCol.textContent = day.getDate();
      row.appendChild(dateCol);

      const dayCol = document.createElement('div');
      dayCol.className = 'day-col';
      dayCol.textContent = dayNames[idx];
      row.appendChild(dayCol);

      const mealsCol = document.createElement('div');
      mealsCol.className = 'meals-col';

      if (dayDishes.length === 0) {
        const empty = document.createElement('span');
        empty.className = 'empty-meals';
        empty.textContent = '—';
        mealsCol.appendChild(empty);
      } else {
        dayDishes.forEach(dish => {
          const chip = document.createElement('span');
          chip.className = `meal-chip ${dish.status}`;
          if (dish.liked) chip.classList.add('liked');
          chip.textContent = dish.name;
          chip.draggable = true;
          chip.dataset.id = dish.id;
          chip.dataset.date = dateStr;
          // При клике на чип – открываем модалку? Чтобы не мешать перетаскиванию, клик будет только если не было перетаскивания.
          // Но мы оставим клик для удобства, а drag будет работать параллельно.
          chip.addEventListener('click', (e) => {
            if (e.detail > 0) openModal(dateStr);
          });
          mealsCol.appendChild(chip);
        });
      }
      row.appendChild(mealsCol);

      // Клик по всей строке открывает модалку (если не перетаскивание)
      row.addEventListener('click', (e) => {
        // Если клик на чипе, мы уже обработали выше, чтобы не дублировать
        if (e.target.closest('.meal-chip')) return;
        openModal(dateStr);
      });

      list.appendChild(row);
    });

    container.appendChild(list);
  }

  // ============================================================
  // МЕНЮ С ФИЛЬТРАЦИЕЙ
  // ============================================================
  function renderMenu() {
    const container = document.getElementById('menuContent');
    const periodLabel = document.getElementById('menuPeriod');
    periodLabel.textContent = currentView === 'month' ? 'месяц' : 'неделю';

    let days = [];
    if (currentView === 'month') {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const last = new Date(year, month + 1, 0);
      for (let d = 1; d <= last.getDate(); d++) {
        days.push(new Date(year, month, d));
      }
    } else {
      days = getWeekDays(currentDate);
    }

    // Собираем все блюда за период
    let allDishes = [];
    days.forEach(day => {
      const dateStr = day.toISOString().slice(0, 10);
      const dayDishes = getDishesForDate(dateStr);
      dayDishes.forEach(dish => {
        allDishes.push({ ...dish, displayDate: formatDate(day) });
      });
    });

    // Фильтрация
    let filtered = allDishes;
    if (searchQuery.trim()) {
      const q = searchQuery.trim().toLowerCase();
      filtered = filtered.filter(d => d.name.toLowerCase().includes(q));
    }
    if (statusFilter !== 'all') {
      filtered = filtered.filter(d => d.status === statusFilter);
    }
    if (categoryFilter !== 'all') {
      filtered = filtered.filter(d => getCategory(d.name) === categoryFilter);
    }

    // Группируем по дате для отображения
    const grouped = {};
    filtered.forEach(dish => {
      const dateStr = dish.date;
      if (!grouped[dateStr]) grouped[dateStr] = [];
      grouped[dateStr].push(dish);
    });

    const sortedDates = Object.keys(grouped).sort();

    container.innerHTML = '';
    if (sortedDates.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'menu-empty';
      empty.textContent = '😌 Нет блюд, соответствующих фильтрам';
      container.appendChild(empty);
      return;
    }

    sortedDates.forEach(dateStr => {
      const dayDishes = grouped[dateStr];
      const displayDate = dayDishes[0].displayDate || formatDate(new Date(dateStr));

      const group = document.createElement('div');
      group.className = 'menu-group';

      const dateEl = document.createElement('div');
      dateEl.className = 'menu-date';
      dateEl.textContent = displayDate;
      group.appendChild(dateEl);

      dayDishes.forEach(dish => {
        const category = getCategory(dish.name);
        let categoryClass = '';
        if (category === 'soup') categoryClass = 'category-soup';
        else if (category === 'salad') categoryClass = 'category-salad';
        else if (category === 'main') categoryClass = 'category-main';

        const item = document.createElement('div');
        item.className = `menu-item ${dish.status} ${categoryClass}`;

        const nameSpan = document.createElement('span');
        nameSpan.textContent = dish.name;
        item.appendChild(nameSpan);

        const badge = document.createElement('span');
        badge.className = 'status-badge';
        badge.textContent = dish.status === 'done' ? '✅' : '📅';
        item.appendChild(badge);

        group.appendChild(item);
      });

      container.appendChild(group);
    });
  }

  // ============================================================
  // МОДАЛКА ДНЯ (с редактированием названия)
  // ============================================================
  function openModal(dateStr) {
    const overlay = document.getElementById('modalOverlay');
    const modalDate = document.getElementById('modalDate');
    const content = document.getElementById('modalContent');

    const d = new Date(dateStr);
    modalDate.textContent = formatDate(d);

    const dayDishes = getDishesForDate(dateStr);

    let html = '';

    html += `<div class="day-meals-section">`;
    html += `<h4>📋 Меню на день</h4>`;

    if (dayDishes.length === 0) {
      html += `<div class="modal-empty">😌 На этот день пока ничего нет</div>`;
    } else {
      dayDishes.forEach(dish => {
        const statusLabel = dish.status === 'done' ? '✅ Готовила' : '📅 Планирую';
        html += `
          <div class="modal-dish ${dish.status} ${dish.liked ? 'liked' : ''}" data-id="${dish.id}">
            <span class="dish-name" id="dishName_${dish.id}">${dish.name}</span>
            <div class="dish-actions">
              <span class="dish-status">${statusLabel}</span>
              <button class="action-btn edit-btn" data-id="${dish.id}" title="Редактировать">✎</button>
              <button class="action-btn like-btn ${dish.liked ? 'liked' : ''}" data-id="${dish.id}" title="Лайк">${dish.liked ? '❤️' : '🤍'}</button>
              <button class="action-btn toggle-status-btn" data-id="${dish.id}" title="Переключить статус">🔄</button>
              <button class="action-btn delete-btn" data-id="${dish.id}" title="Удалить">🗑️</button>
            </div>
          </div>
        `;
      });
    }
    html += `</div>`;

    // Блок добавления (без изменений)
    html += `
      <div class="modal-add-section">
        <h4>➕ Добавить блюдо</h4>
        <div class="modal-add-new">
          <input type="text" id="modalNewDishName" placeholder="Название блюда">
          <select id="modalNewDishStatus">
            <option value="planned">📅 Планирую</option>
            <option value="done">✅ Готовила</option>
          </select>
          <button id="modalAddDishBtn">Добавить</button>
        </div>
        <h4 style="margin-top:12px;">📖 Выбрать из меню</h4>
        <div class="modal-suggest-list" id="modalSuggestList">
    `;

    const uniqueDishes = getUniqueDishesWithLastDate();
    const existingNames = dayDishes.map(d => d.name);
    const available = uniqueDishes.filter(item => !existingNames.includes(item.name));

    if (available.length === 0) {
      html += `<div class="modal-no-suggest">Все блюда уже добавлены на этот день</div>`;
    } else {
      available.forEach(item => {
        const lastText = item.lastDate ? `Последний раз: ${daysAgo(item.lastDate)}` : 'Никогда не готовила';
        html += `
          <div class="modal-suggest-item" data-name="${item.name}">
            <span class="suggest-name">${item.name}</span>
            <span class="suggest-last">${lastText}</span>
          </div>
        `;
      });
    }

    html += `</div></div>`;

    content.innerHTML = html;

    // --- Обработчики (уже были) + новый для редактирования ---

    // Редактирование названия
    content.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const id = Number(this.dataset.id);
        const dishDiv = this.closest('.modal-dish');
        const nameSpan = dishDiv.querySelector('.dish-name');
        const currentName = nameSpan.textContent;

        // Заменяем span на input
        const input = document.createElement('input');
        input.type = 'text';
        input.value = currentName;
        input.className = 'edit-input';
        input.style.width = '100%';
        input.style.padding = '2px 6px';
        input.style.borderRadius = '8px';
        input.style.border = '1px solid var(--cell-border)';
        input.style.background = 'var(--input-bg)';
        input.style.color = 'var(--text-primary)';
        input.style.fontSize = 'inherit';
        nameSpan.replaceWith(input);
        input.focus();
        input.select();

        // Сохранение по нажатию Enter или потери фокуса
        const save = () => {
          const newName = input.value.trim();
          if (newName && newName !== currentName) {
            editDishName(id, newName);
            // Переоткрываем модалку, чтобы обновить список
            openModal(dateStr);
          } else {
            // Если имя не изменилось или пустое, просто возвращаем span
            input.replaceWith(nameSpan);
          }
        };

        input.addEventListener('blur', save);
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            input.blur();
          }
          if (e.key === 'Escape') {
            input.value = currentName;
            input.blur();
          }
        });
      });
    });

    // Остальные обработчики (лайк, переключение статуса, удаление) – без изменений
    content.querySelectorAll('.like-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const id = Number(this.dataset.id);
        const dish = dishes.find(d => d.id === id);
        if (dish) {
          dish.liked = !dish.liked;
          saveDishes();
          renderAll();
          openModal(dateStr);
        }
      });
    });

    content.querySelectorAll('.toggle-status-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const id = Number(this.dataset.id);
        const dish = dishes.find(d => d.id === id);
        if (dish) {
          dish.status = dish.status === 'done' ? 'planned' : 'done';
          saveDishes();
          renderAll();
          openModal(dateStr);
        }
      });
    });

    content.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        const id = Number(this.dataset.id);
        if (confirm('Удалить это блюдо?')) {
          dishes = dishes.filter(d => d.id !== id);
          saveDishes();
          renderAll();
          openModal(dateStr);
        }
      });
    });

    // Добавление нового блюда (без изменений)
    const addBtn = document.getElementById('modalAddDishBtn');
    const nameInput = document.getElementById('modalNewDishName');
    const statusSelect = document.getElementById('modalNewDishStatus');

    if (addBtn) {
      addBtn.addEventListener('click', function() {
        const name = nameInput.value.trim();
        if (!name) {
          alert('Введи название блюда');
          return;
        }
        const status = statusSelect.value;
        dishes.push({ id: Date.now() + Math.random() * 10000, name, status, date: dateStr, liked: false });
        saveDishes();
        renderAll();
        openModal(dateStr);
        nameInput.value = '';
      });
    }

    content.querySelectorAll('.modal-suggest-item').forEach(item => {
      item.addEventListener('click', function() {
        const name = this.dataset.name;
        dishes.push({ id: Date.now() + Math.random() * 10000, name, status: 'planned', date: dateStr, liked: false });
        saveDishes();
        renderAll();
        openModal(dateStr);
      });
    });

    overlay.classList.add('active');
  }

  // ============================================================
  // ВСПОМОГАТЕЛЬНЫЕ ДЛЯ РЕКОМЕНДАЦИЙ (без изменений)
  // ============================================================
  function getUniqueDishesWithLastDate() {
    const map = {};
    dishes.forEach(d => {
      if (!map[d.name] || d.date > map[d.name]) {
        map[d.name] = d.date;
      }
    });
    return Object.entries(map).map(([name, lastDate]) => ({ name, lastDate }));
  }

  // ============================================================
  // ТЕМА (тёмная/светлая)
  // ============================================================
  function initTheme() {
    const savedTheme = localStorage.getItem('mealPlannerTheme');
    if (savedTheme === 'dark') {
      document.body.classList.add('dark-theme');
    }
    document.getElementById('themeToggle').addEventListener('click', function() {
      document.body.classList.toggle('dark-theme');
      const isDark = document.body.classList.contains('dark-theme');
      localStorage.setItem('mealPlannerTheme', isDark ? 'dark' : 'light');
    });
  }

  // ============================================================
  // ПОИСК И ФИЛЬТРАЦИЯ – обработчики
  // ============================================================
  function initSearchFilter() {
    const searchInput = document.getElementById('searchInput');
    const statusFilterEl = document.getElementById('statusFilter');
    const categoryFilterEl = document.getElementById('categoryFilter');

    searchInput.addEventListener('input', function() {
      searchQuery = this.value;
      renderMenu();
    });

    statusFilterEl.addEventListener('change', function() {
      statusFilter = this.value;
      renderMenu();
    });

    categoryFilterEl.addEventListener('change', function() {
      categoryFilter = this.value;
      renderMenu();
    });
  }

  // ============================================================
  // ОСТАЛЬНЫЕ ОБРАБОТЧИКИ (навигация, модалки, свайпы) – без изменений
  // ============================================================
  // (здесь идёт код, который уже был, я не буду повторять его полностью, 
  //  в финальном файле он будет)

  // ============================================================
  // СТАРТ ПРИЛОЖЕНИЯ
  // ============================================================
  function init() {
    initDishes();
    initTheme();
    initSearchFilter();
    initDragDrop();

    // Обработчики навигации
    document.getElementById('prevMonth').addEventListener('click', () => changePeriod(-1));
    document.getElementById('nextMonth').addEventListener('click', () => changePeriod(1));
    document.getElementById('todayBtn').addEventListener('click', function() {
      currentDate = new Date();
      renderAll();
    });

    document.querySelectorAll('#viewToggle button').forEach(btn => {
      btn.addEventListener('click', function() {
        document.querySelectorAll('#viewToggle button').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentView = this.dataset.view;
        renderAll();
      });
    });

    document.getElementById('modalClose').addEventListener('click', () => {
      document.getElementById('modalOverlay').classList.remove('active');
    });
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) document.getElementById('modalOverlay').classList.remove('active');
    });

    // Рекомендации и любимые (оставляем как было)
    document.getElementById('recClose').addEventListener('click', () => {
      document.getElementById('recOverlay').classList.remove('active');
    });
    document.getElementById('recOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) document.getElementById('recOverlay').classList.remove('active');
    });

    document.getElementById('suggestBtn').addEventListener('click', () => {
      document.getElementById('choiceOverlay').classList.add('active');
    });
    document.getElementById('choiceClose').addEventListener('click', () => {
      document.getElementById('choiceOverlay').classList.remove('active');
    });
    document.getElementById('choiceOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) e.target.classList.remove('active');
    });
    document.getElementById('choiceFromMenu').addEventListener('click', function() {
      document.getElementById('choiceOverlay').classList.remove('active');
      openRecommendations();
    });
    document.getElementById('choiceFromTaste').addEventListener('click', function() {
      document.getElementById('choiceOverlay').classList.remove('active');
      alert('✨ Функция «На твой вкус» будет доступна после загрузки ваших любимых блюд.\nЗагрузите их позже в разделе «Любимые».');
    });

    document.getElementById('favoritesBtn').addEventListener('click', openFavorites);

    // Глобальное добавление
    document.getElementById('addDishBtn').addEventListener('click', function() {
      const defaultDate = new Date();
      defaultDate.setDate(defaultDate.getDate() + 1);
      document.getElementById('newDishDate').value = defaultDate.toISOString().slice(0, 10);
      document.getElementById('newDishName').value = '';
      document.getElementById('newDishStatus').value = 'planned';
      document.getElementById('addModalOverlay').classList.add('active');
    });
    document.getElementById('addModalClose').addEventListener('click', () => {
      document.getElementById('addModalOverlay').classList.remove('active');
    });
    document.getElementById('addModalCancel').addEventListener('click', () => {
      document.getElementById('addModalOverlay').classList.remove('active');
    });
    document.getElementById('addModalOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) document.getElementById('addModalOverlay').classList.remove('active');
    });
    document.getElementById('addModalSave').addEventListener('click', function() {
      const nameInput = document.getElementById('newDishName');
      const dateInput = document.getElementById('newDishDate');
      const statusSelect = document.getElementById('newDishStatus');
      const name = nameInput.value.trim();
      if (!name) {
        alert('Введи название блюда');
        return;
      }
      let date = dateInput.value;
      if (!date) {
        const d = new Date();
        d.setDate(d.getDate() + 1);
        date = d.toISOString().slice(0, 10);
      }
      dishes.push({ id: Date.now() + Math.random() * 10000, name, status: statusSelect.value, date, liked: false });
      saveDishes();
      renderAll();
      document.getElementById('addModalOverlay').classList.remove('active');
      nameInput.value = '';
    });

    // Свайпы
    let touchStartX = 0, touchEndX = 0;
    const wrap = document.getElementById('calendarWrap');
    wrap.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    wrap.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 50) {
        changePeriod(diff > 0 ? 1 : -1);
      }
    }, { passive: true });

    let mouseDown = false, mouseStartX = 0;
    wrap.addEventListener('mousedown', (e) => {
      mouseDown = true;
      mouseStartX = e.screenX;
    });
    window.addEventListener('mouseup', (e) => {
      if (mouseDown) {
        const diff = mouseStartX - e.screenX;
        if (Math.abs(diff) > 50) {
          changePeriod(diff > 0 ? 1 : -1);
        }
        mouseDown = false;
      }
    });

    // Функции для рекомендаций и любимых (без изменений)
    function openRecommendations() {
      const recOverlay = document.getElementById('recOverlay');
      document.getElementById('recTitle').textContent = '🍽️ Рекомендации';
      const { liked, others } = getRecommendations();
      buildRecModal(liked, others, '👆 Кликните по блюду, чтобы добавить его в план на завтра');
      recOverlay.classList.add('active');
    }

    function openFavorites() {
      const recOverlay = document.getElementById('recOverlay');
      document.getElementById('recTitle').textContent = '❤️ Любимые блюда';
      const favs = dishes.filter(d => d.liked);
      const recContent = document.getElementById('recContent');
      recContent.innerHTML = '';
      if (favs.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'modal-empty';
        empty.textContent = '😌 У вас пока нет любимых блюд. Отмечайте блюда сердечком ❤️ в модалке дня.';
        recContent.appendChild(empty);
      } else {
        const map = {};
        favs.forEach(d => {
          if (!map[d.name] || d.date > map[d.name]) {
            map[d.name] = { name: d.name, lastDate: d.date, id: d.id };
          }
        });
        const list = Object.values(map);
        list.sort((a, b) => a.lastDate.localeCompare(b.lastDate));
        let html = `<div class="rec-section"><h4>Все любимые блюда</h4>`;
        list.forEach(item => {
          const ago = daysAgo(item.lastDate);
          html += `
            <div class="rec-item" data-id="${item.id}" data-name="${item.name}">
              <span class="rec-name">❤️ ${item.name}</span>
              <span class="rec-days">последний раз ${ago}</span>
              <button class="rec-remove" title="Убрать из любимых">✕</button>
            </div>
          `;
        });
        html += `</div><div class="rec-hint">👆 Кликните по блюду (кроме крестика), чтобы добавить его в план на завтра.<br>Нажмите ✕, чтобы убрать из любимых.</div>`;
        recContent.innerHTML = html;
        recContent.querySelectorAll('.rec-item').forEach(item => {
          const removeBtn = item.querySelector('.rec-remove');
          item.addEventListener('click', function(e) {
            if (e.target === removeBtn) return;
            const name = this.dataset.name;
            const tomorrow = new Date();
            tomorrow.setDate(tomorrow.getDate() + 1);
            const dateStr = tomorrow.toISOString().slice(0, 10);
            dishes.push({ id: Date.now() + Math.random() * 10000, name, status: 'planned', date: dateStr, liked: false });
            saveDishes();
            renderAll();
            recOverlay.classList.remove('active');
            alert(`✅ Блюдо "${name}" добавлено в план на завтра (${formatDate(tomorrow)})`);
          });
          if (removeBtn) {
            removeBtn.addEventListener('click', function(e) {
              e.stopPropagation();
              const id = Number(this.closest('.rec-item').dataset.id);
              const dish = dishes.find(d => d.id === id);
              if (dish) {
                dish.liked = false;
                saveDishes();
                openFavorites();
              }
            });
          }
        });
      }
      recOverlay.classList.add('active');
    }

    function getRecommendations() {
      const doneDishes = dishes.filter(d => d.status === 'done');
      const map = {};
      doneDishes.forEach(d => {
        if (!map[d.name] || d.date > map[d.name]) {
          map[d.name] = { name: d.name, lastDate: d.date, liked: d.liked };
        }
      });
      const unique = Object.values(map);
      unique.sort((a, b) => a.lastDate.localeCompare(b.lastDate));
      const liked = unique.filter(item => item.liked);
      const others = unique.filter(item => !item.liked);
      return { liked: liked.slice(0, 3), others: others.slice(0, 5) };
    }

    function buildRecModal(liked, others, hint) {
      const recContent = document.getElementById('recContent');
      let html = '';
      if (liked.length === 0 && others.length === 0) {
        html = `<div class="modal-empty">😌 Нет блюд в истории, которые можно было бы предложить.</div>`;
      } else {
        if (liked.length > 0) {
          html += `<div class="rec-section"><h4>❤️ Любимые (давно не готовила)</h4>`;
          liked.forEach(item => {
            const ago = daysAgo(item.lastDate);
            html += `
              <div class="rec-item" data-name="${item.name}">
                <span class="rec-name">${item.name}</span>
                <span class="rec-days">последний раз ${ago}</span>
              </div>
            `;
          });
          html += `</div>`;
        }
        if (others.length > 0) {
          html += `<div class="rec-section"><h4>🍽️ Ещё варианты</h4>`;
          others.forEach(item => {
            const ago = daysAgo(item.lastDate);
            html += `
              <div class="rec-item" data-name="${item.name}">
                <span class="rec-name">${item.name}</span>
                <span class="rec-days">последний раз ${ago}</span>
              </div>
            `;
          });
          html += `</div>`;
        }
        html += `<div class="rec-hint">${hint}</div>`;
      }
      recContent.innerHTML = html;
      recContent.querySelectorAll('.rec-item').forEach(item => {
        item.addEventListener('click', function() {
          const name = this.dataset.name;
          const tomorrow = new Date();
          tomorrow.setDate(tomorrow.getDate() + 1);
          const dateStr = tomorrow.toISOString().slice(0, 10);
          dishes.push({ id: Date.now() + Math.random() * 10000, name, status: 'planned', date: dateStr, liked: false });
          saveDishes();
          renderAll();
          document.getElementById('recOverlay').classList.remove('active');
          alert(`✅ Блюдо "${name}" добавлено в план на завтра (${formatDate(tomorrow)})`);
        });
      });
    }

    function changePeriod(delta) {
      if (currentView === 'month') {
        currentDate.setMonth(currentDate.getMonth() + delta);
      } else {
        currentDate.setDate(currentDate.getDate() + delta * 7);
      }
      renderAll();
    }

    // Запуск
    renderAll();
  }

  // Запускаем приложение после загрузки DOM
  document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
