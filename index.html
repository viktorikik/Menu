<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Меню · Календарь</title>
    <style>
        /* Все стили без изменений — они были хорошие, но мы улучшаем навигацию */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        :root {
            --bg-primary: #f5f3f0;
            --bg-app: rgba(255, 255, 255, 0.8);
            --bg-app-border: rgba(255, 255, 255, 0.4);
            --text-primary: #1c1c2a;
            --text-secondary: #4a4a5a;
            --text-muted: #6b6b7a;
            --cell-bg: rgba(255, 255, 255, 0.5);
            --cell-border: rgba(255, 255, 255, 0.7);
            --tag-bg: white;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --btn-bg: #1e1e2a;
            --btn-text: white;
            --input-bg: rgba(255, 255, 255, 0.7);
            --badge-bg: rgba(0, 0, 0, 0.05);
            --empty-border: rgba(0, 0, 0, 0.05);
            --planned-color: #fbbf24;
            --done-color: #34d399;
            --liked-color: #ef4444;
            --planned-bg: rgba(251, 191, 36, 0.15);
            --done-bg: rgba(52, 211, 153, 0.15);
            --modal-overlay: rgba(0, 0, 0, 0.4);
            --modal-bg: white;
            --day-hover: rgba(0, 0, 0, 0.04);
            --modal-text: #1c1c2a;
            --chip-bg: rgba(255, 255, 255, 0.7);
            --week-row-bg: rgba(255, 255, 255, 0.3);
            --menu-item-bg: rgba(255, 255, 255, 0.3);
            --suggest-item-bg: rgba(128, 128, 140, 0.06);
            --rec-item-bg: rgba(128, 128, 140, 0.06);
            --color-soup: #fbbf24;
            --color-salad: #34d399;
            --color-main: #ef4444;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #0f0f17;
                --bg-app: rgba(25, 25, 38, 0.92);
                --bg-app-border: rgba(255, 255, 255, 0.06);
                --text-primary: #ececf0;
                --text-secondary: #b0b0c8;
                --text-muted: #7a7a92;
                --cell-bg: rgba(40, 40, 56, 0.5);
                --cell-border: rgba(255, 255, 255, 0.05);
                --tag-bg: rgba(45, 45, 65, 0.7);
                --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
                --btn-bg: #3a3a52;
                --btn-text: #f0f0f5;
                --input-bg: rgba(45, 45, 65, 0.6);
                --badge-bg: rgba(255, 255, 255, 0.05);
                --empty-border: rgba(255, 255, 255, 0.03);
                --planned-color: #fcd34d;
                --done-color: #6ee7b7;
                --liked-color: #f87171;
                --planned-bg: rgba(252, 211, 77, 0.12);
                --done-bg: rgba(110, 231, 183, 0.12);
                --modal-overlay: rgba(0, 0, 0, 0.7);
                --modal-bg: #1e1e2e;
                --day-hover: rgba(255, 255, 255, 0.05);
                --modal-text: #ececf0;
                --chip-bg: rgba(45, 45, 65, 0.7);
                --week-row-bg: rgba(40, 40, 56, 0.5);
                --menu-item-bg: rgba(40, 40, 56, 0.5);
                --suggest-item-bg: rgba(60, 60, 80, 0.4);
                --rec-item-bg: rgba(60, 60, 80, 0.4);
                --color-soup: #fbbf24;
                --color-salad: #34d399;
                --color-main: #f87171;
            }
        }

        body {
            background: var(--bg-primary);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px;
            transition: background 0.3s;
        }

        .app {
            max-width: 960px;
            width: 100%;
            background: var(--bg-app);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 40px;
            padding: 24px 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--bg-app-border);
            transition: all 0.3s;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 620;
            letter-spacing: -0.3px;
            color: var(--text-primary);
        }

        .logo h1 span {
            font-size: 13px;
            color: var(--text-muted);
            background: var(--badge-bg);
            padding: 3px 12px;
            border-radius: 40px;
            margin-left: 8px;
            font-weight: 400;
        }

        .controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .view-toggle {
            display: flex;
            gap: 3px;
            background: rgba(128, 128, 140, 0.1);
            padding: 4px;
            border-radius: 40px;
        }

        .view-toggle button {
            border: none;
            background: transparent;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 550;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .view-toggle button.active {
            background: var(--tag-bg);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            color: var(--text-primary);
        }

        .smart-btn-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .what-cook-btn {
            background: var(--btn-bg);
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            color: var(--btn-text);
            font-size: 16px;
            font-weight: 580;
            box-shadow: 0 8px 24px -8px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .what-cook-btn:hover {
            transform: scale(1.02);
            filter: brightness(1.12);
        }

        .what-cook-btn:active {
            transform: scale(0.97);
        }

        .favorites-btn {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-primary);
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }

        .favorites-btn:hover {
            background: var(--cell-bg);
        }

        .favorites-btn .heart {
            color: var(--liked-color);
        }

        .add-dish-btn {
            background: var(--done-color);
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            color: white;
            font-size: 14px;
            font-weight: 580;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
            box-shadow: 0 4px 12px rgba(52, 211, 153, 0.3);
        }

        .add-dish-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.08);
        }

        /* ===== УЛУЧШЕННАЯ НАВИГАЦИЯ КАЛЕНДАРЯ ===== */
        .calendar-wrap {
            background: rgba(128, 128, 140, 0.04);
            border-radius: 28px;
            padding: 10px 6px 14px;
            margin-bottom: 16px;
            touch-action: pan-y;
            user-select: none;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .calendar-header .nav-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .calendar-header h2 {
            font-size: 18px;
            font-weight: 560;
            color: var(--text-primary);
            text-align: center;
            flex: 1 1 auto;
            min-width: 120px;
        }

        .month-nav {
            display: flex;
            gap: 6px;
        }

        .month-nav button {
            background: var(--cell-bg);
            border: 1px solid var(--cell-border);
            border-radius: 30px;
            padding: 8px 18px;
            cursor: pointer;
            font-size: 22px;
            font-weight: 500;
            color: var(--text-primary);
            transition: 0.15s;
            line-height: 1.2;
            min-height: 44px;
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
        }

        .month-nav button:hover {
            background: var(--day-hover);
            transform: scale(1.05);
        }

        .month-nav button:active {
            transform: scale(0.93);
        }

        .today-btn {
            background: var(--done-color);
            border: none;
            border-radius: 30px;
            padding: 8px 20px;
            font-size: 15px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            transition: 0.15s;
            line-height: 1.2;
            box-shadow: 0 2px 12px rgba(52, 211, 153, 0.3);
            min-height: 44px;
            white-space: nowrap;
        }

        .today-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.08);
        }

        .today-btn:active {
            transform: scale(0.95);
        }

        /* Остальные стили без изменений (они уже хорошие) */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 500;
            color: var(--text-muted);
            font-size: 11px;
            letter-spacing: 0.3px;
            padding: 6px 0 4px;
            text-transform: uppercase;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .day-cell {
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            background: var(--cell-bg);
            border: 1px solid var(--cell-border);
            cursor: pointer;
            transition: 0.15s;
            position: relative;
            min-height: 60px;
            padding: 6px 4px;
            width: 100%;
        }

        .day-cell:hover {
            background: var(--day-hover);
        }

        .day-cell.empty {
            background: transparent;
            border: 1px dashed var(--empty-border);
            cursor: default;
            pointer-events: none;
        }
        .day-cell.empty:hover {
            background: transparent;
        }

        .day-number {
            font-weight: 550;
            font-size: 14px;
            color: var(--text-primary);
            line-height: 1;
            margin-bottom: 4px;
        }

        .day-cell.has-done {
            background: var(--done-bg);
            border-color: var(--done-color);
        }
        .day-cell.has-done .day-number {
            color: var(--done-color);
        }

        .day-cell.has-planned {
            background: var(--planned-bg);
            border-color: var(--planned-color);
        }
        .day-cell.has-planned .day-number {
            color: var(--planned-color);
        }

        .day-cell.has-both {
            background: linear-gradient(135deg, var(--done-bg) 50%, var(--planned-bg) 50%);
            border-color: var(--done-color);
        }

        .day-cell.today {
            border-color: var(--text-primary);
            border-width: 2px;
        }

        .week-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding: 4px 0;
        }

        .week-row {
            display: grid;
            grid-template-columns: 50px 80px 1fr;
            gap: 10px;
            align-items: center;
            background: var(--week-row-bg);
            border-radius: 14px;
            padding: 8px 12px;
            border: 1px solid var(--cell-border);
            cursor: pointer;
            transition: 0.15s;
        }

        .week-row:hover {
            background: var(--day-hover);
        }

        .week-row .date-col {
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            text-align: center;
        }

        .week-row .day-col {
            font-weight: 500;
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
        }

        .week-row .meals-col {
            display: flex;
            flex-wrap: wrap;
            gap: 4px 8px;
        }

        .week-row .meal-chip {
            font-size: 13px;
            padding: 2px 10px;
            border-radius: 30px;
            background: var(--chip-bg);
            border-left: 3px solid var(--text-muted);
            color: var(--text-primary);
            white-space: nowrap;
        }

        .week-row .meal-chip.done {
            border-left-color: var(--done-color);
        }
        .week-row .meal-chip.planned {
            border-left-color: var(--planned-color);
        }
        .week-row .meal-chip.liked {
            border-left-color: var(--liked-color);
            background: rgba(239, 68, 68, 0.08);
        }

        .week-row .empty-meals {
            color: var(--text-muted);
            font-size: 13px;
            font-style: italic;
        }

        .menu-list {
            margin-top: 16px;
            background: rgba(128, 128, 140, 0.04);
            border-radius: 24px;
            padding: 14px 16px;
            max-height: 300px;
            overflow-y: auto;
        }

        .menu-list h3 {
            font-weight: 540;
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .menu-group {
            margin-bottom: 10px;
        }

        .menu-date {
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 4px;
        }

        .menu-item {
            padding: 5px 12px;
            border-radius: 12px;
            background: var(--menu-item-bg);
            margin-bottom: 3px;
            font-size: 14px;
            color: var(--text-primary);
            display: flex;
            justify-content: space-between;
            border-left: 3px solid var(--text-muted);
        }

        .menu-item.done {
            border-left-color: var(--done-color);
        }
        .menu-item.planned {
            border-left-color: var(--planned-color);
        }

        .menu-item.category-soup {
            border-left-color: var(--color-soup);
        }
        .menu-item.category-salad {
            border-left-color: var(--color-salad);
        }
        .menu-item.category-main {
            border-left-color: var(--color-main);
        }

        .menu-item .status-badge {
            font-size: 12px;
            color: var(--text-muted);
        }

        .menu-empty {
            color: var(--text-muted);
            text-align: center;
            padding: 20px 0;
            font-size: 14px;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--modal-overlay);
            backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--modal-bg);
            border-radius: 32px;
            padding: 28px 24px;
            max-width: 540px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.3);
            border: 1px solid var(--cell-border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .modal-header h3 {
            font-size: 20px;
            font-weight: 600;
            color: var(--modal-text);
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 0 8px;
            line-height: 1;
        }
        .modal-close:hover {
            color: var(--text-primary);
        }

        .day-meals-section {
            margin-bottom: 20px;
            border-bottom: 2px solid var(--cell-border);
            padding-bottom: 16px;
        }

        .day-meals-section h4 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-dish {
            padding: 10px 14px;
            border-radius: 16px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--cell-bg);
            border-left: 4px solid var(--text-muted);
            color: var(--modal-text);
            font-size: 15px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .modal-dish.done {
            border-left-color: var(--done-color);
        }
        .modal-dish.planned {
            border-left-color: var(--planned-color);
        }
        .modal-dish.liked {
            border-left-color: var(--liked-color);
        }

        .modal-dish .dish-name {
            flex: 1;
            min-width: 80px;
        }

        .modal-dish .dish-actions {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }

        .modal-dish .dish-status {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            margin-right: 4px;
        }

        .modal-dish .action-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 0 4px;
            transition: 0.15s;
            color: var(--text-muted);
        }
        .modal-dish .action-btn:hover {
            transform: scale(1.2);
            color: var(--text-primary);
        }
        .modal-dish .delete-btn:hover {
            color: #e55a5a;
        }
        .modal-dish .like-btn {
            font-size: 20px;
        }
        .modal-dish .like-btn.liked {
            color: var(--liked-color);
        }

        .modal-empty {
            color: var(--text-muted);
            text-align: center;
            padding: 20px 0;
            font-size: 15px;
        }

        .modal-add-section {
            margin-top: 8px;
            padding-top: 16px;
        }

        .modal-add-section h4 {
            font-size: 15px;
            font-weight: 550;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .modal-add-new {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 14px;
        }

        .modal-add-new input {
            flex: 2;
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid var(--cell-border);
            background: var(--input-bg);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
            min-width: 120px;
        }

        .modal-add-new input:focus {
            border-color: var(--done-color);
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.15);
        }

        .modal-add-new select {
            padding: 8px 14px;
            border-radius: 40px;
            border: 1px solid var(--cell-border);
            background: var(--input-bg);
            font-size: 14px;
            color: var(--text-primary);
            outline: none;
        }

        .modal-add-new button {
            background: var(--btn-bg);
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            color: var(--btn-text);
            font-weight: 550;
            font-size: 14px;
            cursor: pointer;
            transition: 0.15s;
        }

        .modal-add-new button:hover {
            filter: brightness(1.12);
        }

        .modal-suggest-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .modal-suggest-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: var(--suggest-item-bg);
            border-radius: 30px;
            cursor: pointer;
            transition: 0.15s;
            font-size: 14px;
            color: var(--text-primary);
        }

        .modal-suggest-item:hover {
            background: var(--day-hover);
        }

        .modal-suggest-item .suggest-name {
            font-weight: 500;
        }

        .modal-suggest-item .suggest-last {
            font-size: 12px;
            color: var(--text-muted);
        }

        .modal-no-suggest {
            color: var(--text-muted);
            font-size: 14px;
            font-style: italic;
            padding: 8px 0;
        }

        .rec-modal .modal {
            max-width: 480px;
        }

        .rec-modal .rec-section {
            margin-bottom: 16px;
        }

        .rec-modal .rec-section h4 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .rec-modal .rec-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: var(--rec-item-bg);
            border-radius: 30px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: 0.15s;
            font-size: 14px;
            color: var(--text-primary);
            gap: 8px;
        }

        .rec-modal .rec-item:hover {
            background: var(--day-hover);
        }

        .rec-modal .rec-item .rec-name {
            font-weight: 500;
            flex: 1;
        }

        .rec-modal .rec-item .rec-days {
            font-size: 12px;
            color: var(--text-muted);
        }

        .rec-modal .rec-item .rec-remove {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-muted);
            transition: 0.15s;
            padding: 0 4px;
        }

        .rec-modal .rec-item .rec-remove:hover {
            color: #e55a5a;
            transform: scale(1.2);
        }

        .rec-modal .rec-empty {
            color: var(--text-muted);
            font-size: 14px;
            font-style: italic;
            padding: 8px 0;
        }

        .rec-modal .rec-hint {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 12px;
            text-align: center;
            border-top: 1px solid var(--cell-border);
            padding-top: 12px;
        }

        .add-modal .modal {
            max-width: 400px;
        }

        .add-modal .form-group {
            margin-bottom: 16px;
        }

        .add-modal .form-group label {
            display: block;
            font-weight: 500;

        .add-modal .form-group input,

        .choice-overlay {

            backdrop-filter: blur(8px);

        .choice-overlay.active {

        .choice-modal {

        .choice-modal .choice-btn {

        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 700px) {

            /* Улучшенная навигация на мобилках */

            .modal-dish { font-size: 13px; padding: 8px 10px; }
            .choice-modal h2 { font-size: 20px; }

            .week-row {
                grid-template-columns: 30px 50px 1fr;
                gap: 4px;
                padding: 4px 8px;

            }

    </style>
</head>
<body>

        <button class="choice-close" id="choiceClose">Закрыть</button>

<script>
    // ============================================================
    // 1. Модуль данных (DishStore) – управление блюдами
    // ============================================================
    const DishStore = (function() {
        const STORAGE_KEY = 'smartMenuDishes_v3';
        let dishes = [];
        let cacheUnique = null;
        let cacheRecs = null;

        const DEFAULT_DISHES = [
            { name: 'Гороховый суп', status: 'done', date: '2026-08-24' },
            { name: 'Запеканка из фарша и овощей', status: 'done', date: '2026-08-25' },
            { name: 'Колбаски и запеченая картошка', status: 'done', date: '2026-08-26' },
            { name: 'Плов', status: 'planned', date: '2026-08-28' },
            { name: 'Салат с крабовыми палочками', status: 'planned', date: '2026-08-28' },
            { name: 'Суп борщ?', status: 'planned', date: '2026-08-31' },
            { name: 'Котлеты с картофельным пюре', status: 'planned', date: '2026-09-01' },
            { name: 'Салат морковь по-корейски', status: 'planned', date: '2026-09-01' },
            { name: 'Печень и перловка', status: 'planned', date: '2026-09-02' },
            { name: 'Мясо по-французски', status: 'planned', date: '2026-09-03' },
            { name: 'Морская капуста с крабовыми палочками', status: 'planned', date: '2026-09-04' },
            { name: 'Суп с сайрой', status: 'planned', date: '2026-09-07' },
            { name: 'Тушеная капуста', status: 'planned', date: '2026-09-08' },
            { name: 'Запеченные куриные ножки', status: 'planned', date: '2026-09-09' },
            { name: 'Фунчоза', status: 'planned', date: '2026-09-09' },
            { name: 'Удон', status: 'planned', date: '2026-09-10' },
            { name: 'Паста Болоньезе', status: 'planned', date: '2026-09-12' },
        ];

        function generateId() {
            return Date.now() + Math.random() * 10000;
        }

        function load() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length) {
                        dishes = parsed;
                        return true;
                    }
                }
            } catch (e) {
                console.warn('Ошибка загрузки данных из localStorage:', e);
            }
            return false;
        }

        function save() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(dishes));
                cacheUnique = null;
                cacheRecs = null;
            } catch (e) {
                console.error('Ошибка сохранения данных:', e);
            }
        }

        function init() {
            if (!load()) {
                const result = DEFAULT_DISHES.map((d, i) => ({
                    ...d,
                    id: generateId() + i,
                    liked: false
                }));
                const noDate = [
                    'Салат с морской капустой и крабовым мясом',
                    'Гречка и салат из свежей капусты как в столовой',
                    'Суп-пюре из кабачков'
                ];
                const today = new Date();
                noDate.forEach((name, idx) => {
                    const d = new Date(today);
                    d.setDate(d.getDate() + 7 + idx);
                    result.push({
                        id: generateId() + 1000 + idx,
                        name: name,
                        status: 'planned',
                        date: d.toISOString().slice(0, 10),
                        liked: false
                    });
                });
                dishes = result;
                save();
            }
            cacheUnique = null;
            cacheRecs = null;
        }

        function getAll() {
            return dishes.slice();
        }

        function getForDate(dateStr) {
            return dishes.filter(d => d.date === dateStr);
        }

        function addDish(name, status, date, liked = false) {
            if (!name || !status || !date) return false;
            const id = generateId();
            dishes.push({ id, name, status, date, liked });
            save();
            return true;
        }

        function removeDish(id) {
            const index = dishes.findIndex(d => d.id === id);
            if (index === -1) return false;
            dishes.splice(index, 1);
            save();
            return true;
        }

        function toggleStatus(id) {
            const dish = dishes.find(d => d.id === id);
            if (!dish) return false;
            dish.status = dish.status === 'done' ? 'planned' : 'done';
            save();
            return true;
        }

        function toggleLike(id) {
            const dish = dishes.find(d => d.id === id);
            if (!dish) return false;
            dish.liked = !dish.liked;
            save();
            return true;
        }

        function getUniqueWithLastDate() {
            if (cacheUnique) return cacheUnique;
            const map = {};
            dishes.forEach(d => {
                if (!map[d.name] || d.date > map[d.name]) {
                    map[d.name] = d.date;
                }
            });
            const result = Object.entries(map).map(([name, date]) => ({ name, lastDate: date }));
            result.sort((a, b) => a.lastDate.localeCompare(b.lastDate));
            cacheUnique = result;
            return result;
        }

        function getRecommendations() {
            if (cacheRecs) return cacheRecs;
            const doneDishes = dishes.filter(d => d.status === 'done');
            const map = {};
            doneDishes.forEach(d => {
                if (!map[d.name] || d.date > map[d.name]) {
                    map[d.name] = { name: d.name, lastDate: d.date, liked: d.liked };
                }
            });
            const unique = Object.values(map);
            unique.sort((a, b) => a.lastDate.localeCompare(b.lastDate));
            const liked = unique.filter(item => item.liked);
            const others = unique.filter(item => !item.liked);
            const result = { liked: liked.slice(0, 3), others: others.slice(0, 5) };
            cacheRecs = result;
            return result;
        }

        function invalidateCache() {
            cacheUnique = null;
            cacheRecs = null;
        }

        function getFavorites() {
            return dishes.filter(d => d.liked);
        }

        return {
            init,
            getAll,
            getForDate,
            addDish,
            removeDish,
            toggleStatus,
            toggleLike,
            getUniqueWithLastDate,
            getRecommendations,
            getFavorites,
            invalidateCache
        };
    })();

    // ============================================================
    // 2. Утилиты (форматирование, категории, безопасность)
    // ============================================================
    const Utils = {
        escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        },

        formatDate(date) {
            const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
            return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
        },

        daysAgo(dateStr) {
            const today = new Date();
            const d = new Date(dateStr);
            const diff = Math.floor((today - d) / (1000 * 60 * 60 * 24));
            if (diff === 0) return 'сегодня';
            if (diff === 1) return 'вчера';
            if (diff < 7) return `${diff} дня назад`;
            if (diff < 14) return 'неделю назад';
            if (diff < 30) return `${Math.floor(diff / 7)} недели назад`;
            return `${diff} дней назад`;
        },

        getCategory(name) {
            const lower = name.toLowerCase();
            if (lower.includes('суп') || lower.includes('борщ') || lower.includes('пюре') || lower.includes('бульон')) {
                return 'soup';
            }
            if (lower.includes('салат') || lower.includes('винегрет') || lower.includes('овощ') || lower.includes('зелень')) {
                return 'salad';
            }
            if (lower.includes('котлет') || lower.includes('запекан') || lower.includes('тушен') || 
                lower.includes('колбас') || lower.includes('жарен') || lower.includes('печень') || 
                lower.includes('мясо') || lower.includes('курин') || lower.includes('индей') || 
                lower.includes('рыб') || lower.includes('бифштекс') || lower.includes('стейк') || 
                lower.includes('паста') || lower.includes('макарон') || lower.includes('греч') || 
                lower.includes('рис') || lower.includes('плов') || lower.includes('картош') || 
                lower.includes('каш')) {
                return 'main';
            }
            return 'other';
        },

        getWeekDays(baseDate) {
            const start = new Date(baseDate);
            start.setDate(start.getDate() - start.getDay() + 1);
            const week = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(start);
                d.setDate(start.getDate() + i);
                week.push(d);
            }
            return week;
        },

        createElement(tag, className = '', text = '') {
            const el = document.createElement(tag);
            if (className) el.className = className;
            if (text) el.textContent = text;
            return el;
        }
    };

    // ============================================================
    // 3. Модуль рендеринга (Renderer) – создание DOM-элементов
    // ============================================================
    const Renderer = (function() {
        let currentView = 'month';
        let currentDate = new Date();
        let currentDateStr = currentDate.toISOString().slice(0, 10);

        const monthTitle = document.getElementById('monthTitle');
        const calendarContent = document.getElementById('calendarContent');
        const menuContent = document.getElementById('menuContent');
        const menuPeriod = document.getElementById('menuPeriod');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalDate = document.getElementById('modalDate');
        const modalContent = document.getElementById('modalContent');
        const recOverlay = document.getElementById('recOverlay');
        const recTitle = document.getElementById('recTitle');
        const recContent = document.getElementById('recContent');

        function renderCalendar(view, date) {
            currentView = view;
            currentDate = date;
            currentDateStr = date.toISOString().slice(0, 10);

            const year = date.getFullYear();
            const month = date.getMonth();
            const monthName = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'][month];
            monthTitle.textContent = `${monthName} ${year}`;

            calendarContent.innerHTML = '';
            if (view === 'month') {
                renderMonthView(year, month);
            } else {
                renderWeekView(date);
            }
            renderMenu();
        }

        function renderMonthView(year, month) {
            const grid = document.createElement('div');
            grid.className = 'days-grid';

            const first = new Date(year, month, 1);
            const last = new Date(year, month + 1, 0);
            const totalDays = last.getDate();
            let startDay = first.getDay() - 1;
            if (startDay < 0) startDay = 6;

            for (let i = 0; i < startDay; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell empty';
                grid.appendChild(empty);
            }

            const today = new Date();
            const todayStr = today.toISOString().slice(0, 10);

            for (let day = 1; day <= totalDays; day++) {
                const d = new Date(year, month, day);
                const dateStr = d.toISOString().slice(0, 10);
                const cell = createDayCell(d, dateStr, todayStr);
                grid.appendChild(cell);
            }

            calendarContent.appendChild(grid);
        }

        function createDayCell(date, dateStr, todayStr) {
            const cell = document.createElement('div');
            cell.className = 'day-cell';

            const dayDishes = DishStore.getForDate(dateStr);
            const hasDone = dayDishes.some(d => d.status === 'done');
            const hasPlanned = dayDishes.some(d => d.status === 'planned');

            if (hasDone) cell.classList.add('has-done');
            if (hasPlanned) cell.classList.add('has-planned');
            if (hasDone && hasPlanned) cell.classList.add('has-both');
            if (dateStr === todayStr) cell.classList.add('today');

            const numDiv = document.createElement('div');
            numDiv.className = 'day-number';
            numDiv.textContent = date.getDate();
            cell.appendChild(numDiv);

            cell.addEventListener('click', () => {
                openModal(dateStr);
            });

            return cell;
        }

        function renderWeekView(baseDate) {
            const week = Utils.getWeekDays(baseDate);
            const list = document.createElement('div');
            list.className = 'week-list';

            const dayNames = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

            week.forEach((day, idx) => {
                const dateStr = day.toISOString().slice(0, 10);
                const dayDishes = DishStore.getForDate(dateStr);

                const row = document.createElement('div');
                row.className = 'week-row';

                const dateCol = document.createElement('div');
                dateCol.className = 'date-col';
                dateCol.textContent = day.getDate();
                row.appendChild(dateCol);

                const dayCol = document.createElement('div');
                dayCol.className = 'day-col';
                dayCol.textContent = dayNames[idx];
                row.appendChild(dayCol);

                const mealsCol = document.createElement('div');
                mealsCol.className = 'meals-col';

                if (dayDishes.length === 0) {
                    const empty = document.createElement('span');
                    empty.className = 'empty-meals';
                    empty.textContent = '—';
                    mealsCol.appendChild(empty);
                } else {
                    dayDishes.forEach(dish => {
                        const chip = document.createElement('span');
                        chip.className = `meal-chip ${dish.status}`;
                        if (dish.liked) chip.classList.add('liked');
                        chip.textContent = dish.name;
                        mealsCol.appendChild(chip);
                    });
                }
                row.appendChild(mealsCol);

                row.addEventListener('click', () => {
                    openModal(dateStr);
                });

                list.appendChild(row);
            });

            calendarContent.appendChild(list);
        }

        function renderMenu() {
            const view = currentView;
            menuPeriod.textContent = view === 'month' ? 'месяц' : 'неделю';

            let days = [];
            if (view === 'month') {
                const year = currentDate.getFullYear();
                const month = currentDate.getMonth();
                const last = new Date(year, month + 1, 0);
                for (let d = 1; d <= last.getDate(); d++) {
                    days.push(new Date(year, month, d));
                }
            } else {
                days = Utils.getWeekDays(currentDate);
            }

            const grouped = {};
            days.forEach(day => {
                const dateStr = day.toISOString().slice(0, 10);
                const dayDishes = DishStore.getForDate(dateStr);
                if (dayDishes.length > 0) {
                    grouped[dateStr] = dayDishes;
                }
            });

            const sortedDates = Object.keys(grouped).sort();

            menuContent.innerHTML = '';
            if (sortedDates.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'menu-empty';
                empty.textContent = '😌 Нет блюд на этот период';
                menuContent.appendChild(empty);
                return;
            }

            sortedDates.forEach(dateStr => {
                const d = new Date(dateStr);
                const dayDishes = grouped[dateStr];
                const displayDate = Utils.formatDate(d);

                const group = document.createElement('div');
                group.className = 'menu-group';

                const dateEl = document.createElement('div');
                dateEl.className = 'menu-date';
                dateEl.textContent = displayDate;
                group.appendChild(dateEl);

                dayDishes.forEach(dish => {
                    const category = Utils.getCategory(dish.name);
                    let categoryClass = '';
                    if (category === 'soup') categoryClass = 'category-soup';
                    else if (category === 'salad') categoryClass = 'category-salad';
                    else if (category === 'main') categoryClass = 'category-main';

                    const item = document.createElement('div');
                    item.className = `menu-item ${dish.status} ${categoryClass}`;

                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = dish.name;
                    item.appendChild(nameSpan);

                    const badge = document.createElement('span');
                    badge.className = 'status-badge';
                    badge.textContent = dish.status === 'done' ? '✅' : '📅';
                    item.appendChild(badge);

                    group.appendChild(item);
                });

                menuContent.appendChild(group);
            });
        }

        function openModal(dateStr) {
            const d = new Date(dateStr);
            modalDate.textContent = Utils.formatDate(d);

            const dayDishes = DishStore.getForDate(dateStr);
            modalContent.innerHTML = '';

            const section = document.createElement('div');
            section.className = 'day-meals-section';

            const title = document.createElement('h4');
            title.textContent = '📋 Меню на день';
            section.appendChild(title);

            if (dayDishes.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'modal-empty';
                empty.textContent = '😌 На этот день пока ничего нет';
                section.appendChild(empty);
            } else {
                dayDishes.forEach(dish => {
                    const dishDiv = document.createElement('div');
                    dishDiv.className = `modal-dish ${dish.status}`;
                    if (dish.liked) dishDiv.classList.add('liked');

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'dish-name';
                    nameSpan.textContent = dish.name;
                    dishDiv.appendChild(nameSpan);

                    const actions = document.createElement('div');
                    actions.className = 'dish-actions';

                    const statusSpan = document.createElement('span');
                    statusSpan.className = 'dish-status';
                    statusSpan.textContent = dish.status === 'done' ? '✅ Готовила' : '📅 Планирую';
                    actions.appendChild(statusSpan);

                    const likeBtn = document.createElement('button');
                    likeBtn.className = `action-btn like-btn ${dish.liked ? 'liked' : ''}`;
                    likeBtn.textContent = dish.liked ? '❤️' : '🤍';
                    likeBtn.title = 'Лайк';
                    likeBtn.dataset.id = dish.id;
                    likeBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = Number(this.dataset.id);
                        DishStore.toggleLike(id);
                        openModal(dateStr);
                    });
                    actions.appendChild(likeBtn);

                    const toggleBtn = document.createElement('button');
                    toggleBtn.className = 'action-btn toggle-status-btn';
                    toggleBtn.textContent = '🔄';
                    toggleBtn.title = 'Переключить статус';
                    toggleBtn.dataset.id = dish.id;
                    toggleBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = Number(this.dataset.id);
                        DishStore.toggleStatus(id);
                        openModal(dateStr);
                    });
                    actions.appendChild(toggleBtn);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'action-btn delete-btn';
                    deleteBtn.textContent = '🗑️';
                    deleteBtn.title = 'Удалить';
                    deleteBtn.dataset.id = dish.id;
                    deleteBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = Number(this.dataset.id);
                        if (confirm('Удалить это блюдо?')) {
                            DishStore.removeDish(id);
                            openModal(dateStr);
                        }
                    });
                    actions.appendChild(deleteBtn);

                    dishDiv.appendChild(actions);
                    section.appendChild(dishDiv);
                });
            }
            modalContent.appendChild(section);

            const addSection = document.createElement('div');
            addSection.className = 'modal-add-section';

            const addTitle = document.createElement('h4');
            addTitle.textContent = '➕ Добавить блюдо';
            addSection.appendChild(addTitle);

            const addForm = document.createElement('div');
            addForm.className = 'modal-add-new';

            const nameInput = document.createElement('input');
            nameInput.type = 'text';
            nameInput.placeholder = 'Название блюда';
            nameInput.id = 'modalNewDishName';
            addForm.appendChild(nameInput);

            const statusSelect = document.createElement('select');
            statusSelect.id = 'modalNewDishStatus';
            const optPlanned = document.createElement('option');
            optPlanned.value = 'planned';
            optPlanned.textContent = '📅 Планирую';
            statusSelect.appendChild(optPlanned);
            const optDone = document.createElement('option');
            optDone.value = 'done';
            optDone.textContent = '✅ Готовила';
            statusSelect.appendChild(optDone);
            addForm.appendChild(statusSelect);

            const addBtn = document.createElement('button');
            addBtn.textContent = 'Добавить';
            addForm.appendChild(addBtn);
            addSection.appendChild(addForm);

            const suggestTitle = document.createElement('h4');
            suggestTitle.textContent = '📖 Выбрать из меню';
            suggestTitle.style.marginTop = '12px';
            addSection.appendChild(suggestTitle);

            const suggestList = document.createElement('div');
            suggestList.className = 'modal-suggest-list';
            suggestList.id = 'modalSuggestList';

            const uniqueDishes = DishStore.getUniqueWithLastDate();
            const existingNames = dayDishes.map(d => d.name);
            const available = uniqueDishes.filter(item => !existingNames.includes(item.name));

            if (available.length === 0) {
                const noSuggest = document.createElement('div');
                noSuggest.className = 'modal-no-suggest';
                noSuggest.textContent = 'Все блюда уже добавлены на этот день';
                suggestList.appendChild(noSuggest);
            } else {
                available.forEach(item => {
                    const suggestItem = document.createElement('div');
                    suggestItem.className = 'modal-suggest-item';
                    suggestItem.dataset.name = item.name;

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'suggest-name';
                    nameSpan.textContent = item.name;
                    suggestItem.appendChild(nameSpan);

                    const lastSpan = document.createElement('span');
                    lastSpan.className = 'suggest-last';
                    lastSpan.textContent = item.lastDate ? `Последний раз: ${Utils.daysAgo(item.lastDate)}` : 'Никогда не готовила';
                    suggestItem.appendChild(lastSpan);

                    suggestItem.addEventListener('click', function() {
                        const name = this.dataset.name;
                        DishStore.addDish(name, 'planned', dateStr, false);
                        openModal(dateStr);
                    });

                    suggestList.appendChild(suggestItem);
                });
            }
            addSection.appendChild(suggestList);
            modalContent.appendChild(addSection);

            addBtn.addEventListener('click', function() {
                const name = nameInput.value.trim();
                if (!name) {
                    alert('Введи название блюда');
                    return;
                }
                const status = statusSelect.value;
                DishStore.addDish(name, status, dateStr, false);
                openModal(dateStr);
                nameInput.value = '';
            });

            modalOverlay.classList.add('active');
        }

        function closeModal() {
            modalOverlay.classList.remove('active');
        }

        function openRecommendations() {
            recTitle.textContent = '🍽️ Рекомендации';
            const { liked, others } = DishStore.getRecommendations();
            buildRecModal(liked, others, '👆 Кликните по блюду, чтобы добавить его в план на завтра');
            recOverlay.classList.add('active');
        }

        function openFavorites() {
            recTitle.textContent = '❤️ Любимые блюда';
            const favs = DishStore.getFavorites();
            recContent.innerHTML = '';
            if (favs.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'modal-empty';
                empty.textContent = '😌 У вас пока нет любимых блюд. Отмечайте блюда сердечком ❤️ в модалке дня.';
                recContent.appendChild(empty);
            } else {
                const map = {};
                favs.forEach(d => {
                    if (!map[d.name] || d.date > map[d.name]) {
                        map[d.name] = { name: d.name, lastDate: d.date, id: d.id };
                    }
                });
                const list = Object.values(map);
                list.sort((a, b) => a.lastDate.localeCompare(b.lastDate));

                const section = document.createElement('div');
                section.className = 'rec-section';
                const title = document.createElement('h4');
                title.textContent = 'Все любимые блюда';
                section.appendChild(title);

                list.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'rec-item';
                    row.dataset.id = item.id;
                    row.dataset.name = item.name;

                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'rec-name';
                    nameSpan.textContent = '❤️ ' + item.name;
                    row.appendChild(nameSpan);

                    const daysSpan = document.createElement('span');
                    daysSpan.className = 'rec-days';
                    daysSpan.textContent = `последний раз ${Utils.daysAgo(item.lastDate)}`;
                    row.appendChild(daysSpan);

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'rec-remove';
                    removeBtn.textContent = '✕';
                    removeBtn.title = 'Убрать из любимых';
                    row.appendChild(removeBtn);

                    row.addEventListener('click', function(e) {
                        if (e.target === removeBtn) return;
                        const name = this.dataset.name;
                        const tomorrow = new Date();
                        tomorrow.setDate(tomorrow.getDate() + 1);
                        const dateStr = tomorrow.toISOString().slice(0, 10);
                        DishStore.addDish(name, 'planned', dateStr, false);
                        recOverlay.classList.remove('active');
                        alert(`✅ Блюдо "${name}" добавлено в план на завтра (${Utils.formatDate(tomorrow)})`);
                    });

                    removeBtn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = Number(this.closest('.rec-item').dataset.id);
                        const dish = DishStore.getAll().find(d => d.id === id);
                        if (dish) {
                            DishStore.toggleLike(id);
                            openFavorites();
                        }
                    });

                    section.appendChild(row);
                });

                recContent.appendChild(section);

                const hint = document.createElement('div');
                hint.className = 'rec-hint';
                hint.textContent = '👆 Кликните по блюду (кроме крестика), чтобы добавить его в план на завтра.\nНажмите ✕, чтобы убрать из любимых.';
                recContent.appendChild(hint);
            }
            recOverlay.classList.add('active');
        }

        function closeRecModal() {
            recOverlay.classList.remove('active');
        }

        function buildRecModal(liked, others, hint) {
            recContent.innerHTML = '';
            if (liked.length === 0 && others.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'modal-empty';
                empty.textContent = '😌 Нет блюд в истории, которые можно было бы предложить.';
                recContent.appendChild(empty);
                return;
            }

            if (liked.length > 0) {
                const section = document.createElement('div');
                section.className = 'rec-section';
                const title = document.createElement('h4');
                title.textContent = '❤️ Любимые (давно не готовила)';
                section.appendChild(title);
                liked.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'rec-item';
                    row.dataset.name = item.name;
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'rec-name';
                    nameSpan.textContent = item.name;
                    row.appendChild(nameSpan);
                    const daysSpan = document.createElement('span');
                    daysSpan.className = 'rec-days';
                    daysSpan.textContent = `последний раз ${Utils.daysAgo(item.lastDate)}`;
                    row.appendChild(daysSpan);
                    row.addEventListener('click', function() {
                        const name = this.dataset.name;
                        const tomorrow = new Date();
                        tomorrow.setDate(tomorrow.getDate() + 1);
                        const dateStr = tomorrow.toISOString().slice(0, 10);
                        DishStore.addDish(name, 'planned', dateStr, false);
                        recOverlay.classList.remove('active');
                        alert(`✅ Блюдо "${name}" добавлено в план на завтра (${Utils.formatDate(tomorrow)})`);
                    });
                    section.appendChild(row);
                });
                recContent.appendChild(section);
            }

            if (others.length > 0) {
                const section = document.createElement('div');
                section.className = 'rec-section';
                const title = document.createElement('h4');
                title.textContent = '🍽️ Ещё варианты';
                section.appendChild(title);
                others.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'rec-item';
                    row.dataset.name = item.name;
                    const nameSpan = document.createElement('span');
                    nameSpan.className = 'rec-name';
                    nameSpan.textContent = item.name;
                    row.appendChild(nameSpan);
                    const daysSpan = document.createElement('span');
                    daysSpan.className = 'rec-days';
                    daysSpan.textContent = `последний раз ${Utils.daysAgo(item.lastDate)}`;
                    row.appendChild(daysSpan);
                    row.addEventListener('click', function() {
                        const name = this.dataset.name;
                        const tomorrow = new Date();
                        tomorrow.setDate(tomorrow.getDate() + 1);
                        const dateStr = tomorrow.toISOString().slice(0, 10);
                        DishStore.addDish(name, 'planned', dateStr, false);
                        recOverlay.classList.remove('active');
                        alert(`✅ Блюдо "${name}" добавлено в план на завтра (${Utils.formatDate(tomorrow)})`);
                    });
                    section.appendChild(row);
                });
                recContent.appendChild(section);
            }

            const hintDiv = document.createElement('div');
            hintDiv.className = 'rec-hint';
            hintDiv.textContent = hint;
            recContent.appendChild(hintDiv);
        }

        function openAddModal() {
            const defaultDate = new Date();
            defaultDate.setDate(defaultDate.getDate() + 1);
            document.getElementById('newDishDate').value = defaultDate.toISOString().slice(0, 10);
            document.getElementById('newDishName').value = '';
            document.getElementById('newDishStatus').value = 'planned';
            document.getElementById('addModalOverlay').classList.add('active');
        }

        function closeAddModal() {
            document.getElementById('addModalOverlay').classList.remove('active');
        }

        return {
            renderCalendar,
            renderMenu,
            openModal,
            closeModal,
            openRecommendations,
            openFavorites,
            closeRecModal,
            openAddModal,
            closeAddModal,
            getCurrentDate: () => currentDate,
            getCurrentView: () => currentView,
            setCurrentDate: (date) => { currentDate = date; },
            setCurrentView: (view) => { currentView = view; }
        };
    })();

    // ============================================================
    // 4. Инициализация событий и приложения
    // ============================================================
    (function init() {
        DishStore.init();

        const now = new Date();
        Renderer.setCurrentDate(now);
        Renderer.setCurrentView('month');
        Renderer.renderCalendar('month', now);

        document.getElementById('prevMonth').addEventListener('click', function() {
            const curDate = Renderer.getCurrentDate();
            const view = Renderer.getCurrentView();
            const newDate = new Date(curDate);
            if (view === 'month') {
                newDate.setMonth(newDate.getMonth() - 1);
            } else {
                newDate.setDate(newDate.getDate() - 7);
            }
            Renderer.setCurrentDate(newDate);
            Renderer.renderCalendar(view, newDate);
        });

        document.getElementById('nextMonth').addEventListener('click', function() {
            const curDate = Renderer.getCurrentDate();
            const view = Renderer.getCurrentView();
            const newDate = new Date(curDate);
            if (view === 'month') {
                newDate.setMonth(newDate.getMonth() + 1);
            } else {
                newDate.setDate(newDate.getDate() + 7);
            }
            Renderer.setCurrentDate(newDate);
            Renderer.renderCalendar(view, newDate);
        });

        document.getElementById('todayBtn').addEventListener('click', function() {
            const now = new Date();
            const view = Renderer.getCurrentView();
            Renderer.setCurrentDate(now);
            Renderer.renderCalendar(view, now);
        });

        document.querySelectorAll('#viewToggle button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('#viewToggle button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const view = this.dataset.view;
                Renderer.setCurrentView(view);
                const curDate = Renderer.getCurrentDate();
                Renderer.renderCalendar(view, curDate);
            });
        });

        document.getElementById('modalClose').addEventListener('click', Renderer.closeModal);
        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) Renderer.closeModal();
        });

        document.getElementById('recClose').addEventListener('click', Renderer.closeRecModal);
        document.getElementById('recOverlay').addEventListener('click', function(e) {
            if (e.target === this) Renderer.closeRecModal();
        });

        document.getElementById('suggestBtn').addEventListener('click', function() {
            document.getElementById('choiceOverlay').classList.add('active');
        });

        document.getElementById('choiceClose').addEventListener('click', function() {
            document.getElementById('choiceOverlay').classList.remove('active');
        });
        document.getElementById('choiceOverlay').addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });

        document.getElementById('choiceFromMenu').addEventListener('click', function() {
            document.getElementById('choiceOverlay').classList.remove('active');
            Renderer.openRecommendations();
        });

        document.getElementById('choiceFromTaste').addEventListener('click', function() {
            document.getElementById('choiceOverlay').classList.remove('active');
            alert('✨ Функция «На твой вкус» будет доступна после загрузки ваших любимых блюд.\nЗагрузите их позже в разделе «Любимые».');
        });

        document.getElementById('favoritesBtn').addEventListener('click', Renderer.openFavorites);

        document.getElementById('addDishBtn').addEventListener('click', Renderer.openAddModal);

        document.getElementById('addModalClose').addEventListener('click', Renderer.closeAddModal);
        document.getElementById('addModalCancel').addEventListener('click', Renderer.closeAddModal);
        document.getElementById('addModalOverlay').addEventListener('click', function(e) {
            if (e.target === this) Renderer.closeAddModal();
        });

        document.getElementById('addModalSave').addEventListener('click', function() {
            const nameInput = document.getElementById('newDishName');
            const dateInput = document.getElementById('newDishDate');
            const statusSelect = document.getElementById('newDishStatus');
            const name = nameInput.value.trim();
            if (!name) {
                alert('Введи название блюда');
                return;
            }
            let date = dateInput.value;
            if (!date) {
                const d = new Date();
                d.setDate(d.getDate() + 1);
                date = d.toISOString().slice(0, 10);
            }
            DishStore.addDish(name, statusSelect.value, date, false);
            Renderer.closeAddModal();
            const view = Renderer.getCurrentView();
            const curDate = Renderer.getCurrentDate();
            Renderer.renderCalendar(view, curDate);
            nameInput.value = '';
        });

        let touchStartX = 0;
        let touchEndX = 0;
        const wrap = document.getElementById('calendarWrap');

        wrap.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        wrap.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) {
                const curDate = Renderer.getCurrentDate();
                const view = Renderer.getCurrentView();
                const newDate = new Date(curDate);
                if (view === 'month') {
                    newDate.setMonth(newDate.getMonth() + (diff > 0 ? 1 : -1));
                } else {
                    newDate.setDate(newDate.getDate() + (diff > 0 ? 7 : -7));
                }
                Renderer.setCurrentDate(newDate);
                Renderer.renderCalendar(view, newDate);
            }
        }, { passive: true });

        let mouseDown = false;
        let mouseStartX = 0;
        wrap.addEventListener('mousedown', (e) => {
            mouseDown = true;
            mouseStartX = e.screenX;
        });
        window.addEventListener('mouseup', (e) => {
            if (mouseDown) {
                const diff = mouseStartX - e.screenX;
                if (Math.abs(diff) > 50) {
                    const curDate = Renderer.getCurrentDate();
                    const view = Renderer.getCurrentView();
                    const newDate = new Date(curDate);
                    if (view === 'month') {
                        newDate.setMonth(newDate.getMonth() + (diff > 0 ? 1 : -1));
                    } else {
                        newDate.setDate(newDate.getDate() + (diff > 0 ? 7 : -7));
                    }
                    Renderer.setCurrentDate(newDate);
                    Renderer.renderCalendar(view, newDate);
                }
                mouseDown = false;
            }
        });

        console.log('Приложение инициализировано. Навигация улучшена.');
    })();
</script>
</body>
</html>
